<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090a09">
<meta name="description" content="五連地城是像素風的單人五子棋 Roguelike。連五消線、擊敗守關者，帶著遺物一路深入地城。">
<title>五連地城 | FIVE BELOW</title>
<style>
:root{color-scheme:dark;--bg:#090a09;--panel:#131512;--rim:#393c31;--ink:#f5efdc;--muted:#b1ac98;--sand:#e9c27b;--mint:#bfe9a5;--coral:#ff977c;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif;min-height:100dvh}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:disabled{cursor:default}.ghost:disabled{opacity:.55}button:focus-visible,summary:focus-visible{outline:2px solid var(--sand);outline-offset:3px}h1,h2,p{margin:0}[hidden]{display:none!important}
.shell{max-width:940px;margin:auto;padding:clamp(14px,4vw,40px) clamp(12px,4vw,30px) max(16px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:clamp(12px,3vw,24px)}
.brand{display:flex;align-items:center;gap:11px}.brand-icon{width:42px;flex:none;color:var(--sand);image-rendering:pixelated}.kicker,.eyebrow,.version{font:800 10px/1.3 var(--mono);letter-spacing:.17em;color:var(--sand)}h1{font-size:clamp(24px,5.5vw,38px);line-height:1.1;letter-spacing:.09em;font-weight:900;text-shadow:2px 2px #504024}.tools{display:flex;gap:6px}.ghost,.special,.primary{min-height:40px;border:1px solid var(--rim);border-bottom-width:3px;background:#181b15;padding:6px 10px;font-size:13px;font-weight:750}.ghost:hover,.special:not(:disabled):hover{border-color:var(--sand)}.ghost svg{width:16px;height:16px;display:block}.ghost[aria-pressed=false] .sound-waves{opacity:.18}
.play{display:grid;gap:14px;align-items:start}.arena,.tray{min-width:0}.route{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;list-style:none;margin:0 0 7px;padding:0}.route li{border:1px solid #2c3027;background:#11130f;color:var(--muted);padding:4px 4px 5px;text-align:center;font-size:11px;white-space:nowrap}.route span{font:800 10px var(--mono);margin-right:.35em;color:#aba58b}.route li[aria-current=step]{background:#332719;border-color:#957549;color:#ffdfa2}.route li.cleared{color:var(--mint);border-color:#4a5a3b}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--rim);border-bottom:0;background:#171a15}.combatant:last-child{text-align:right}.combatant b{display:block;font-size:12px;margin-bottom:5px}.you b{color:var(--mint)}.enemy b{color:var(--coral)}.pips{display:flex;gap:4px}.enemy .pips{justify-content:flex-end}.pip{display:block;width:clamp(10px,3vw,18px);height:8px;box-shadow:inset 0 -2px #0005;background:#38392e}.you .pip.filled{background:#a8d887}.enemy .pip.filled{background:#ed795c}.shield{font:700 10px var(--mono);color:var(--sand)}.floor{text-align:center;color:var(--sand);font:800 11px var(--mono);letter-spacing:.12em}
.frame{position:relative;padding:clamp(8px,2.4vw,14px);background:#292b21;border:1px solid #62634c;box-shadow:inset 0 0 0 3px #191a14,0 4px #13150f}
.board{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));aspect-ratio:1;background:#302c22;gap:1px;padding:1px;position:relative;isolation:isolate;user-select:none;-webkit-user-select:none}
.cell{background:#474232;border:0;padding:0;min-width:0;min-height:0;position:relative;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}.cell.alt{background:#4c4736}.cell.star:before{content:"";width:4px;height:4px;background:#968060;position:absolute}.cell:focus-visible{z-index:3;outline:2px solid #ffe6a3;outline-offset:-2px}.cell.last:after,.cell.keyboard:after{content:"";position:absolute;inset:2px;border:1px solid #ffe7aa;opacity:.85;pointer-events:none}.cell.target{background:#624137}.cell.target:hover{background:#844d3e}
.stone{display:block;width:72%;height:72%;pointer-events:none;position:relative;--shape:polygon(24% 0,76% 0,76% 12%,90% 12%,90% 24%,100% 24%,100% 76%,90% 76%,90% 88%,76% 88%,76% 100%,24% 100%,24% 88%,10% 88%,10% 76%,0 76%,0 24%,10% 24%,10% 12%,24% 12%);clip-path:var(--shape);visibility:hidden}
.stone:before{content:"";position:absolute;inset:12%;clip-path:var(--shape);background:var(--core)}.stone:after{content:"";position:absolute;top:23%;left:23%;width:25%;height:13%;background:var(--glint)}
.cell[data-v="1"] .stone,.cell[data-v="2"] .stone,.cell[data-v="3"] .stone{visibility:visible}.cell[data-v="1"] .stone{background:#386044;--core:#a8d887;--glint:#e0f8c1}.cell[data-v="2"] .stone{background:#7e3a32;--core:#e57961;--glint:#ffc5a4}
.cell[data-v="3"] .stone{width:80%;height:80%;background:#272921;--core:#8d9280;--glint:#d0cbb3;--shape:polygon(12% 24%,30% 24%,30% 8%,72% 8%,72% 21%,89% 21%,89% 43%,100% 43%,100% 80%,74% 80%,74% 93%,12% 93%,12% 79%,0 79%,0 40%,12% 40%)}
@media(hover:hover){.board.ready .cell[data-v="0"]:hover{background:#645b42}.board.ready .cell[data-v="0"]:hover .stone{visibility:visible;background:#e0f8c1;opacity:.4}}
.cell.burst{z-index:1;background:#806a38}.cell.burst .stone{animation:burst .36s steps(5,end) both}.cell.burst .stone:before{background:#fff2ad}.cell.removed .stone{visibility:visible;background:#d98a63;animation:burst .36s steps(5,end) both}@keyframes burst{0%,30%{transform:scale(1.14);opacity:1}100%{transform:scale(.25);opacity:0}}
.strike{position:absolute;z-index:4;left:50%;top:47%;transform:translate(-50%,-50%);padding:7px 10px;background:#15130e;border:1px solid currentColor;font-size:clamp(15px,4.2vw,26px);font-weight:900;white-space:nowrap;pointer-events:none;color:#ffe7aa;box-shadow:0 3px #0008}.strike.hostile{color:#ffad93}
.signal{min-height:45px;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);padding:8px 0 0}.signal:before{content:"";width:7px;height:7px;flex:none;background:var(--mint);box-shadow:2px 2px #35452d}.signal[data-tone="enemy"]:before{background:var(--coral);box-shadow:2px 2px #653e36}.signal[data-tone="event"]:before{background:var(--sand);box-shadow:2px 2px #5a492e}
.tray{display:grid;gap:9px}.box,.rules{border:1px solid var(--rim);background:var(--panel);padding:10px 12px}.tray h2{font-size:15px;margin:2px 0 4px}.box p,.rules p{color:var(--muted);font-size:12px;line-height:1.5}.inventory{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.tag{color:#ffe0a0;border:1px solid #645538;background:#262217;padding:3px 6px;font-size:12px}.special{margin-top:9px;color:var(--sand);display:block;width:100%;text-align:left}.special[aria-pressed=true]{background:#432921;border-color:#d38a68}.special:disabled{opacity:.58}.rules summary{cursor:pointer;color:var(--ink);font-size:13px;font-weight:750}.rules p{margin-top:7px}.version{color:var(--muted);font-size:9px}.footer{margin-top:13px;display:flex;justify-content:space-between;gap:7px}
dialog{width:min(92vw,450px);max-height:calc(100dvh - 36px);overflow:auto;background:#191a13;border:2px solid #91734c;color:var(--ink);box-shadow:5px 6px 0 #000b;padding:18px}dialog::backdrop{background:#080908ca}dialog h2{color:#ffe0a0;font-size:25px;margin:4px 0 7px}dialog p{font-size:14px;color:var(--muted);line-height:1.55}.choices{display:grid;gap:7px;margin-top:14px}.choice{display:grid;grid-template-columns:25px 1fr;align-items:center;gap:0 9px;text-align:left;background:#292519;border:1px solid #655436;border-bottom-width:3px;padding:9px 10px}.choice:hover{border-color:var(--sand);background:#342d1e}.choice i{font:800 18px var(--mono);color:var(--sand);grid-row:1/span 2}.choice b{color:#ffe4ad;font-size:15px}.choice small{color:#d5cbb1;line-height:1.4}.primary{display:inline-block;background:#e9c27b;color:#1d170e;border-color:#af874d;margin-top:14px}.primary:hover{background:#ffda93}.confirm-actions{display:flex;align-items:baseline;gap:8px}
@media(min-width:760px){.play{grid-template-columns:minmax(0,550px) minmax(218px,1fr);gap:22px}.tray{margin-top:33px}.frame{padding:14px}.box,.rules{padding:13px 14px}}
@media(prefers-reduced-motion:reduce){.cell.burst .stone,.cell.removed .stone{animation:none}}
</style>
</head>
<body>
<main class="shell">
<header>
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" shape-rendering="crispEdges"><path d="M2 2h20v2H2zM2 20h20v2H2zM2 4h2v16H2zM20 4h2v16h-2z" opacity=".5"/><path d="M16 5h3v3h-3zM12 9h4v4h-4zM8 13h4v4H8zM5 17h3v3H5z"/><path d="M5 5h2v2H5zM17 16h2v2h-2z" opacity=".55"/></svg>
    <div><p class="kicker">FIVE BELOW</p><h1>五連地城</h1></div>
  </div>
  <div class="tools">
    <button class="ghost" id="sound" type="button" aria-label="音效" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path class="sound-waves" d="M11 6v4m3-6v8"/></svg></button>
    <button class="ghost" id="reset" type="button">重新開始</button>
  </div>
</header>
<div class="play">
  <section class="arena" aria-label="地城戰鬥">
    <ol class="route" id="route" aria-label="關卡進度">
      <li aria-current="step"><span>01</span>守門者</li><li><span>02</span>追線者</li><li><span>03</span>石庭王</li>
    </ol>
    <div class="hud">
      <div class="combatant you"><b>你 <span class="shield" id="shield" hidden>◆ 護盾</span></b><div class="pips" id="playerHP"></div></div>
      <div class="floor" id="floor">FLOOR 01</div>
      <div class="combatant enemy"><b id="foeName">守門者</b><div class="pips" id="enemyHP"></div></div>
    </div>
    <div class="frame">
      <div class="board" id="board" role="group" aria-label="11 乘 11 棋盤。可用方向鍵移動焦點，按 Enter 或空白鍵落子。"></div>
      <div class="strike" id="strike" aria-hidden="true" hidden></div>
    </div>
    <p class="signal" id="status" role="status" aria-atomic="true">輪到你。點空格落子。</p>
  </section>
  <aside class="tray" aria-label="關卡資訊與遺物">
    <section class="box"><p class="eyebrow">ENCOUNTER</p><h2 id="encounterTitle">守門者</h2><p id="encounter"></p></section>
    <section class="box"><p class="eyebrow">RELICS</p><h2>遺物</h2><p id="emptyRelics">目前沒有遺物，擊敗守關者後可選擇獎勵。</p><div class="inventory" id="inventory" hidden></div><button class="special" id="pin" type="button" aria-pressed="false" hidden>破陣釘</button></section>
    <details class="rules" open><summary>怎麼玩</summary><p>你執綠棋，和對手輪流下一子。橫、直或斜連成五顆以上，就消除整條線並扣對手 1 點生命。同一手連出兩個方向，就扣 2 點。</p><p>打倒對手後三選一。你的生命與遺物會帶到下一關。生命歸零，就得從第一關開始。</p></details>
  </aside>
</div>
<div class="footer"><span class="version">GOMOKU ROGUELIKE</span><span class="version">v0.1.0</span></div>
</main>
<dialog id="modal" aria-labelledby="modalTitle"><p class="eyebrow" id="modalEyebrow"></p><h2 id="modalTitle"></h2><p id="modalText"></p><div class="choices" id="choices" hidden></div><div class="confirm-actions" id="modalActions"></div></dialog>
<script>
'use strict';
const SIZE=11,N=SIZE*SIZE,PLAYER=1,ENEMY=2,ROCK=3,MAX_HP=4;
const DIRS=[[1,0],[0,1],[1,1],[1,-1]],ADJ=[[1,0],[-1,0],[0,1],[0,-1]];
const LEVELS=[
  {name:'守門者',hp:2,offense:.80,defense:1.15,desc:'擅長攔住你快成形的棋路。試著在同一手佈下兩個威脅。'},
  {name:'追線者',hp:2,offense:1.12,defense:.86,desc:'更積極在不同方向下棋。進攻前，先確認你擋得住它的下一手。'},
  {name:'石庭王',hp:3,offense:1,defense:1.05,desc:'岩石會截斷棋路，雙方都不能落子。找出還能交會的兩條線。'}
];
const RELICS={
  ember:{name:'餘燼',icon:'✦',desc:'五連消除後，保留你這回合剛落下的棋子。'},
  cross:{name:'交叉刃',icon:'×',desc:'同一手完成兩個以上的五連方向時，額外造成 1 點傷害。'},
  pin:{name:'破陣釘',icon:'▣',desc:'每關一次，移除一顆上下左右緊鄰己方棋子的敵棋，取代該回合落子。'},
  rest:{name:'整備',icon:'+',desc:'回復 1 點生命。若已滿血，下一關獲得可抵銷 1 點傷害的護盾。'}
};
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const $=id=>document.getElementById(id);
const board=$('board'),status=$('status'),strike=$('strike'),modal=$('modal');
const cells=[],letters='ABCDEFGHIJK';
let run,focusIndex=60,timer,modalType='',soundEnabled=false,audioContext;
function index(x,y){return x>=0&&x<SIZE&&y>=0&&y<SIZE?y*SIZE+x:-1}
function point(i){return [i%SIZE,Math.floor(i/SIZE)]}
function shuffle(values){const a=[...values];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newRun(){return {stage:0,hp:MAX_HP,enemyHp:2,relics:new Set(),shield:0,pinUsed:false,pinMode:false,mode:'player',last:-1,board:new Uint8Array(N),turns:0}}
function boardFor(stage){
  const b=new Uint8Array(N);
  if(stage!==2)return b;
  const template=shuffle([[[3,3],[2,6],[5,2]],[[4,3],[2,4],[6,2]],[[3,4],[2,2],[5,3]]])[0];
  const rotate=Math.floor(Math.random()*4),reflect=Math.random()<.5;
  for(const [a,c] of template){let x=reflect?10-a:a,y=c;for(let i=0;i<rotate;i++)[x,y]=[10-y,x];b[index(x,y)]=b[index(10-x,10-y)]=ROCK}
  return b;
}
function linesAt(b,i,side){
  if(i<0||i>=N||b[i]!==side)return [];
  const [x,y]=point(i),lines=[];
  for(const [dx,dy] of DIRS){
    const line=[i];
    for(const s of [1,-1]){
      for(let n=1;n<SIZE;n++){
        const j=index(x+n*s*dx,y+n*s*dy);if(j<0||b[j]!==side)break;
        if(s===1)line.push(j);else line.unshift(j);
      }
    }
    if(line.length>=5)lines.push(line);
  }
  return lines;
}
function analyzePlacement(b,i,side,relics){
  if(!Number.isInteger(i)||i<0||i>=N||b[i]!==0)return null;
  b[i]=side;
  const lines=linesAt(b,i,side);
  const damage=lines.length+(lines.length>1&&side===PLAYER&&relics.has('cross')?1:0);
  const cleared=[...new Set(lines.flat())].filter(j=>!(j===i&&side===PLAYER&&relics.has('ember')));
  return {lines,damage,cleared};
}
function legalPin(b,i){
  if(i<0||i>=N||b[i]!==ENEMY)return false;
  const [x,y]=point(i);return ADJ.some(([dx,dy])=>b[index(x+dx,y+dy)]===PLAYER);
}
function pinTargets(){return run.board.some((_,i)=>legalPin(run.board,i))}
function threatShape(b,i,side){
  const [x,y]=point(i);let score=0,certain=0,openThrees=0,same=0;
  for(const [dx,dy] of DIRS){
    let best=0,extra=0,distEnds=0;
    const tape=Array.from({length:9},(_,k)=>k===4?side:(b[index(x+(k-4)*dx,y+(k-4)*dy)]??ROCK));
    if(tape[3]===side)same++;if(tape[5]===side)same++;
    for(let k=0;k<=4;k++){
      const w=tape.slice(k,k+5);
      if(w.some(v=>v!==0&&v!==side))continue;
      const count=w.filter(v=>v===side).length;
      const open=Number(tape[k-1]===0)+Number(tape[k+5]===0);
      if(count===5){certain=1;best=Math.max(best,6500);continue}
      if(count===4){const gap=k+w.indexOf(0);extra|=1<<gap}
      if(count===3&&open===2){const p=w.map((v,j)=>v===side?j:-10).filter(j=>j>=0);if(p[2]-p[0]<=3)distEnds=1}
      best=Math.max(best,([0,0,7,48,115,0][count])*(1+open*.22));
    }
    score+=best+((extra&(extra-1))!==0?425:0);openThrees+=distEnds;
  }
  score+=openThrees>1?108:0;
  return {score,certain,same};
}
function virtualDamage(b,i,side,relics){
  b[i]=side;
  const n=linesAt(b,i,side).length;
  b[i]=0;
  return n+(side===PLAYER&&n>1&&relics.has('cross')?1:0);
}
function chooseEnemy(state){
  const b=state.board,level=LEVELS[state.stage];
  let best=-1,value=-Infinity;
  for(let i=0;i<N;i++){
    if(b[i]!==0)continue;
    const [x,y]=point(i);
    const ours=threatShape(b,i,ENEMY),theirs=threatShape(b,i,PLAYER);
    let v=ours.score*level.offense+theirs.score*level.defense+
      1.28*(10-Math.abs(x-5)-Math.abs(y-5))+2.5*ours.same+1.2*theirs.same+Math.random()*4;
    if(ours.certain){
      const harm=virtualDamage(b,i,ENEMY,state.relics);
      v+=harm*15000+(harm>=state.hp+state.shield?120000:0);
    }
    if(theirs.certain){
      const harm=virtualDamage(b,i,PLAYER,state.relics);
      v+=harm*8000+(harm>=state.enemyHp?48000:0);
    }
    if(v>value){value=v;best=i}
  }
  return best;
}
function hpMeter(el,current,max,label){
  el.replaceChildren();el.setAttribute('role','img');el.setAttribute('aria-label',label+'生命 '+current+'／'+max);
  for(let i=0;i<max;i++){const pip=document.createElement('span');pip.className='pip'+(i<current?' filled':'');pip.setAttribute('aria-hidden','true');el.append(pip)}
}
function message(text,tone='player'){status.textContent=text;status.dataset.tone=tone}
function render(){
  const level=LEVELS[run.stage];
  board.classList.toggle('ready',run.mode==='player'&&!run.pinMode);
  $('reset').disabled=run.mode==='enemy'||run.mode==='effect';
  board.setAttribute('aria-busy',String(run.mode==='enemy'||run.mode==='effect'));
  for(let i=0;i<N;i++){
    const value=run.board[i],btn=cells[i];
    if(btn.dataset.v!==String(value)){
      const [x,y]=point(i);
      btn.dataset.v=value;
      btn.setAttribute('aria-label',letters[x]+(y+1)+'，'+['空格','你的棋子','對手棋子','岩石'][value]);
    }
    btn.tabIndex=i===focusIndex?0:-1;
    btn.classList.toggle('last',i===run.last&&value!==0);
    btn.classList.toggle('target',run.pinMode&&run.mode==='player'&&legalPin(run.board,i));
    btn.setAttribute('aria-disabled',String(run.mode!=='player'||(run.pinMode?!legalPin(run.board,i):value!==0)));
  }
  hpMeter($('playerHP'),run.hp,MAX_HP,'玩家');hpMeter($('enemyHP'),run.enemyHp,level.hp,'敵方');
  $('shield').hidden=run.shield===0;
  $('foeName').textContent=level.name;$('encounterTitle').textContent=level.name;$('encounter').textContent=level.desc;
  $('floor').textContent='FLOOR 0'+(run.stage+1);
  [...$('route').children].forEach((el,i)=>{
    if(i===run.stage)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');
    el.classList.toggle('cleared',i<run.stage||(i===run.stage&&run.enemyHp===0));
  });
  $('inventory').replaceChildren();
  for(const id of run.relics){
    const tag=document.createElement('span');tag.className='tag';tag.textContent=RELICS[id].name;tag.title=RELICS[id].desc;$('inventory').append(tag);
  }
  $('emptyRelics').hidden=run.relics.size>0;$('inventory').hidden=run.relics.size===0;
  $('pin').hidden=!run.relics.has('pin');
  $('pin').disabled=run.mode!=='player'||run.pinUsed||!pinTargets();
  $('pin').setAttribute('aria-pressed',String(run.pinMode));
  $('pin').textContent=run.pinUsed?'破陣釘 · 已使用':run.pinMode?'取消破陣釘':pinTargets()?'破陣釘 · 可使用':'破陣釘 · 無相鄰目標';
}
function schedule(callback,delay){clearTimeout(timer);timer=setTimeout(callback,delay)}
function clearEffects(){cells.forEach(c=>c.classList.remove('burst','removed'));strike.hidden=true}
function playSound(kind){
  if(!soundEnabled)return;
  try{
    audioContext??=new (window.AudioContext||window.webkitAudioContext)();
    if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
    const notes=kind==='hit'?[392,523,784]:kind==='hurt'?[196,147,98]:kind==='clear'?[392,494,588,784]:[kind==='enemy'?160:246];
    const t=audioContext.currentTime;
    notes.forEach((hz,i)=>{
      const osc=audioContext.createOscillator(),gain=audioContext.createGain(),start=t+i*.052;
      osc.type='square';osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(.048,start+.008);gain.gain.exponentialRampToValueAtTime(.0001,start+.065);
      osc.connect(gain).connect(audioContext.destination);osc.start(start);osc.stop(start+.07);
    });
  }catch{}
}
function playerTurn(text='輪到你。點空格落子。'){run.mode='player';message(text);render()}
function passTurn(side){
  if(!run.board.includes(0)){
    for(let i=0;i<N;i++)if(run.board[i]!==ROCK)run.board[i]=0;
    run.last=-1;
    if(side===ENEMY){playerTurn('棋盤已滿，清空棋子後繼續。輪到你。');return}
    message('棋盤已滿，清空棋子後繼續。對手思考中。','enemy');
  }else if(side===PLAYER)message('對手思考中…','enemy');
  if(side===ENEMY){playerTurn();return}
  run.mode='enemy';render();schedule(enemyTurn,240);
}
function enemyTurn(){
  if(run.mode!=='enemy')return;
  const i=chooseEnemy(run);if(i===-1){passTurn(ENEMY);return}place(i,ENEMY);
}
function place(i,side){
  if((side===PLAYER&&run.mode!=='player')||(side===ENEMY&&run.mode!=='enemy'))return;
  const result=analyzePlacement(run.board,i,side,run.relics);if(!result)return;
  run.last=i;run.turns++;playSound(side===PLAYER?'stone':'enemy');
  if(!result.damage){passTurn(side);return}
  run.mode='effect';
  let blocked=0;
  if(side===PLAYER)run.enemyHp=Math.max(0,run.enemyHp-result.damage);
  else{
    blocked=Math.min(run.shield,result.damage);run.shield-=blocked;
    run.hp=Math.max(0,run.hp-result.damage+blocked);
  }
  render();
  for(const j of result.cleared)cells[j].classList.add('burst');
  const damage=result.damage-blocked;
  strike.textContent=damage===0?'護盾抵銷':(result.lines.length>1?'交會連擊':'五連出招')+' −'+damage;
  strike.classList.toggle('hostile',side===ENEMY);strike.hidden=false;
  message((side===PLAYER?'你':'對手')+'完成 '+result.lines.length+' 條五連。'+
    (damage?'造成 '+damage+' 點傷害。':'')+(blocked?'護盾抵銷 '+blocked+' 點。':''),'event');
  playSound(side===PLAYER?'hit':'hurt');
  schedule(()=>{
    for(const j of result.cleared)run.board[j]=0;
    if(run.board[run.last]===0)run.last=-1;
    clearEffects();render();
    if(run.enemyHp===0){roundCleared();return}
    if(run.hp===0){endRun(false);return}
    passTurn(side);
  },reduced.matches?420:610);
}
function usePin(i){
  if(run.mode!=='player'||!run.pinMode||run.pinUsed||!legalPin(run.board,i))return;
  run.board[i]=0;run.pinUsed=true;run.pinMode=false;run.last=-1;run.turns++;run.mode='effect';
  cells[i].classList.add('removed');message('破陣釘移除一顆敵棋。','event');render();playSound('hit');
  schedule(()=>{clearEffects();passTurn(PLAYER)},reduced.matches?240:360);
}
function makeButton(label,kind,callback){
  const button=document.createElement('button');button.type='button';button.textContent=label;button.className=kind;button.addEventListener('click',callback);return button;
}
function showModal(type,eyebrow,title,body){
  modalType=type;$('modalEyebrow').textContent=eyebrow;$('modalTitle').textContent=title;$('modalText').textContent=body;
  $('choices').replaceChildren();$('choices').hidden=true;$('modalActions').replaceChildren();
}
function rewardsForRun(){
  const pool=Object.keys(RELICS).filter(id=>id!=='rest'&&!run.relics.has(id));
  if(run.hp<MAX_HP||pool.length<3)pool.push('rest');
  return shuffle(pool).slice(0,3);
}
function roundCleared(){
  if(run.stage===LEVELS.length-1){endRun(true);return}
  run.mode='reward';render();message('擊敗 '+LEVELS[run.stage].name+'！選一項獎勵。','event');playSound('clear');
  showModal('reward','FLOOR 0'+(run.stage+1)+' / CLEAR','選一項獎勵','你的生命會帶到下一關。選定後立即前進。');
  for(const id of rewardsForRun()){
    const card=makeButton('','choice',()=>selectReward(id));
    const icon=document.createElement('i'),name=document.createElement('b'),desc=document.createElement('small');
    icon.textContent=RELICS[id].icon;icon.setAttribute('aria-hidden','true');name.textContent=RELICS[id].name;desc.textContent=RELICS[id].desc;
    card.append(icon,name,desc);$('choices').append(card);
  }
  $('choices').hidden=false;modal.showModal();
}
function selectReward(id){
  if(run.mode!=='reward'||!Object.hasOwn(RELICS,id))return;
  run.shield=0;
  if(id==='rest'){
    if(run.hp===MAX_HP)run.shield=1;
    else run.hp++;
  }else run.relics.add(id);
  run.stage++;run.enemyHp=LEVELS[run.stage].hp;run.board=boardFor(run.stage);
  run.last=-1;run.pinUsed=false;run.pinMode=false;focusIndex=60;
  modal.close();modalType='';playerTurn('抵達 '+LEVELS[run.stage].name+'。輪到你先下。');cells[focusIndex].focus({preventScroll:true});
}
function endRun(won){
  run.mode=won?'win':'lost';render();
  message(won?'你打倒了石庭王，通過地城！':'生命歸零，這趟挑戰結束。','event');
  if(won)playSound('clear');
  showModal('ending',won?'DUNGEON CLEAR':'RUN OVER',won?'地城通關！':'這趟挑戰結束',won?'你打倒了石庭王，帶著 '+run.hp+' 點生命走出地城。':'你在第 '+(run.stage+1)+' 關遇到 '+LEVELS[run.stage].name+'。重新出發時，遺物會重置。');
  $('modalActions').append(makeButton('再闖一次','primary',resetRun));modal.showModal();
}
function resetRun(){
  clearTimeout(timer);if(modal.open)modal.close();modalType='';clearEffects();
  run=newRun();focusIndex=60;
  playerTurn();cells[focusIndex].focus({preventScroll:true});
}
for(let i=0;i<N;i++){
  const [x,y]=point(i),cell=document.createElement('button'),stone=document.createElement('span');
  cell.type='button';cell.className='cell'+((x+y)%2?' alt':'')+([3,5,7].includes(x)&&[3,5,7].includes(y)?' star':'');
  stone.className='stone';stone.setAttribute('aria-hidden','true');cell.append(stone);cells.push(cell);board.append(cell);
  cell.addEventListener('focus',()=>{
    if(focusIndex===i)return;
    cells[focusIndex].tabIndex=-1;focusIndex=i;cell.tabIndex=0;
  });
  cell.addEventListener('click',()=>{
    if(run.mode!=='player')return;
    if(run.pinMode){usePin(i);return}
    place(i,PLAYER);
  });
  cell.addEventListener('keydown',e=>{
    const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!d)return;
    e.preventDefault();const j=index(x+d[0],y+d[1]);if(j===-1)return;
    cells[focusIndex].tabIndex=-1;focusIndex=j;cells[j].tabIndex=0;cells[j].focus();
  });
}
$('pin').addEventListener('click',()=>{
  if($('pin').disabled)return;
  run.pinMode=!run.pinMode;
  message(run.pinMode?'點選有標示的敵棋。這會用掉本回合的落子機會。':'已取消破陣釘。輪到你。');render();
});
$('sound').addEventListener('click',()=>{
  soundEnabled=!soundEnabled;$('sound').setAttribute('aria-pressed',String(soundEnabled));
  if(soundEnabled)playSound('stone');
});
$('reset').addEventListener('click',()=>{
  if(run.mode==='enemy'||run.mode==='effect')return;
  if(!run.turns){resetRun();return}
  showModal('reset','NEW RUN','重新開始？','目前的關卡、生命和遺物都會重置。');
  $('modalActions').append(makeButton('取消','ghost',()=>{modal.close();modalType=''}),makeButton('重新開始','primary',resetRun));
  modal.showModal();
});
modal.addEventListener('cancel',e=>{if(modalType!=='reset')e.preventDefault();else modalType=''});
run=newRun();playerTurn();
</script>
