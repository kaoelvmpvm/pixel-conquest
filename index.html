<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050611">
<meta name="description" content="像素火線 GATE RUSH：復古 8-bit 太空射擊；擊中閘門能升級並擴張範圍，扇形彈幕迎戰密集敵群。">
<title>像素火線 | 8-BIT GATE RUSH</title>
<style>
:root{color-scheme:dark;background:#050611}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#050611;color:#fff}
#shell{position:relative;width:min(100vw,calc(100dvh * .5));aspect-ratio:1/2;max-height:100dvh;overflow:hidden;box-shadow:0 0 0 3px #182f55,0 12px 80px #0009;touch-action:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;outline:none}
#announce{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (max-aspect-ratio:1/2){#shell{width:100vw;max-height:100dvh}}
</style>
</head>
<body>
<main id="shell" aria-label="像素火線遊戲。拖曳左右移動，自動射擊。">
<canvas id="game" width="360" height="720" tabindex="0" aria-label="像素火線，左右移動射擊"></canvas>
<div id="announce" aria-live="polite"></div>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d',{alpha:false});
const announce=document.getElementById('announce');
const W=360,H=720,FIELD_TOP=72,FIELD_BOTTOM=660;
ctx.imageSmoothingEnabled=false;
const C={
 dark:'#050611',deep:'#090c1c',sky:'#1a3a70',brick:'#10172a',brick2:'#17233c',
 border:'#72a7d8',steel:'#25436c',white:'#fff7dc',text:'#f4f1dc',
 yellow:'#fff26b',gold:'#ffca55',orange:'#ff8749',red:'#fe5a73',
 green:'#8afc8e',mint:'#41f8c5',blue:'#5dc8ff',purple:'#ba86ff'
};
const shipArt=[
'........B........',
'.......BBB.......',
'.......BWB.......',
'......BBWB.......',
'.....BWWWB.......',
'...BBWWWWWBB.....',
'.BBBWWWWWWWBBB...',
'BBBRWWWWWWWRBBB..',
'BBBRWBBBBBWRBBB..',
'.BBBRBBBBBRBBB...',
'..BBBRBBBRBBB....',
'....RR...RR......',
'....OO...OO......'
];
const shipPal={B:'#3989e3',W:'#e5fbff',R:'#ff596f',O:'#ffbc5d'};
const bugArt=[
'..P......P...',
'..PP....PP...',
'...PPPPPP....',
'.PPCCPPCCPP..',
'PPPCCPPCCPPP.',
'PPCPPPPPPCPP.',
'.PP.PPPP.PP..',
'..PP.PP.PP...',
'.PP......PP..',
'P..........P.'
];
const bugPals=[
 {P:'#a979ff',C:'#fff06d'},
 {P:'#ff5e82',C:'#ffef9a'},
 {P:'#54e6c3',C:'#d7fc7e'},
 {P:'#74b8ff',C:'#ffba64'}
];
const stars=Array.from({length:92},(_,i)=>({
 x:(i*137.47+13)%W,y:(i*83.63+29)%(FIELD_BOTTOM-FIELD_TOP),
 speed:18+(i%6)*12,size:i%9===0?3:i%3===0?2:1,shade:i%7===0?'#ffee9b':i%3===0?'#6f91c8':'#b5cbe6'
}));
let audioContext=null,muted=false,sfxTick=0;
const input={x:180,down:false,left:false,right:false};
let player=null,enemies=[],bullets=[],badBullets=[],gates=[],parts=[],texts=[],coins=[],chains=[],laserRays=[];
let boss=null,mode='menu',stage=1,stageTime=0,elapsed=0,score=0,kills=0,baseHp=22,baseMax=22;
let best=0,waveTimer=0,gateTimer=0,shotTimer=0,shake=0,hitFlash=0,phase='waves',endReason='',finishChoice=0;
let lastFrame=0,backScroll=0,waveIndex=0,shotId=0,enemyId=0,hangarTab='ship',lootInfo=null,chestClock=0,shopNotice='',earnedThisRun=0,stageCoins=0;
try{best=Number(localStorage.getItem('gate-rush-best'))||0}catch(e){}

const PROFILE_KEY='gate-rush-profile-v03';
const SHIPS=[
 {id:'pulse',name:'突擊戰機',weapon:'脈衝機砲',rarity:'N',color:'#3993ed',desc:'穩定連射與經典扇形彈幕',rate:1},
 {id:'laser',name:'雷射戰機',weapon:'持續光束',rarity:'R',color:'#ff5278',desc:'密集光束，善於精準破閘',rate:.56},
 {id:'spread',name:'擴散戰機',weapon:'散彈砲',rarity:'R',color:'#f5b948',desc:'近距離多顆彈丸，適合掃射',rate:2},
 {id:'rail',name:'重砲戰機',weapon:'電磁穿甲砲',rarity:'SR',color:'#60ecad',desc:'慢速重砲，可貫穿多名敵人',rate:2.6},
 {id:'homing',name:'追蹤戰機',weapon:'導引飛彈',rarity:'SR',color:'#bd8cff',desc:'導引彈自動追擊分散目標',rate:1.65},
 {id:'plasma',name:'電漿戰機',weapon:'連鎖電弧',rarity:'SSR',color:'#68e6ed',desc:'電流可連鎖鄰近敵人',rate:1.4}
];
const SKINS=[
 {id:'gold',name:'經典金彈',rarity:'N',color:'#fff26b',trail:'#ff8b4a'},
 {id:'ice',name:'冰藍光彈',rarity:'R',color:'#91e6ff',trail:'#3899f9'},
 {id:'neon',name:'霓虹紫彈',rarity:'R',color:'#d59cff',trail:'#a24ce6'},
 {id:'ember',name:'熔岩火彈',rarity:'SR',color:'#ff754f',trail:'#fbcc66'},
 {id:'ghost',name:'幽靈光彈',rarity:'SR',color:'#bbffe4',trail:'#48afbd'},
 {id:'rainbow',name:'彩虹星彈',rarity:'SSR',color:'#ff92c6',trail:'#82e8fa'}
];
const RARITY={N:{rate:55,color:'#b0b7c5'},R:{rate:30,color:'#69baff'},
 SR:{rate:12,color:'#c095ff'},SSR:{rate:3,color:'#ffc85a'}};
function defaultProfile(){return {wallet:0,ships:['pulse'],bullets:['gold'],ship:'pulse',bullet:'gold',pityShip:0,pityBullet:0}}
function loadProfile(){
 let data={};
 try{data=JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')||{}}catch(e){}
 let p={...defaultProfile(),...data};
 p.wallet=Math.max(0,Math.min(9999999,Math.floor(Number(p.wallet)||0)));
 p.ships=Array.isArray(p.ships)?p.ships.filter(x=>SHIPS.some(i=>i.id===x)):['pulse'];
 p.bullets=Array.isArray(p.bullets)?p.bullets.filter(x=>SKINS.some(i=>i.id===x)):['gold'];
 if(!p.ships.includes('pulse'))p.ships.unshift('pulse');
 if(!p.bullets.includes('gold'))p.bullets.unshift('gold');
 if(!p.ships.includes(p.ship))p.ship='pulse';
 if(!p.bullets.includes(p.bullet))p.bullet='gold';
 p.pityShip=Math.max(0,Math.min(9,Number(p.pityShip)||0));
 p.pityBullet=Math.max(0,Math.min(9,Number(p.pityBullet)||0));
 return p;
}
let profile=loadProfile();
function saveProfile(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(profile))}catch(e){shopNotice='儲存失敗：請確認瀏覽器允許網站資料'}}
function currentShip(){return SHIPS.find(s=>s.id===profile.ship)||SHIPS[0]}
function currentSkin(){return SKINS.find(s=>s.id===profile.bullet)||SKINS[0]}
function gainCoins(n){
 const amount=Math.max(0,Math.floor(n));
 profile.wallet+=amount;earnedThisRun+=amount;stageCoins+=amount;
 saveProfile();
}
function openChest(type){
 const price=type==='ship'?120:60,options=type==='ship'?SHIPS:SKINS;
 if(profile.wallet<price){shopNotice='金幣不足，需要 '+price+' 金幣';sfx('hit');return}
 profile.wallet-=price;
 const pityKey=type==='ship'?'pityShip':'pityBullet',roll=Math.random()*100;
 let rarity=roll<3?'SSR':roll<15?'SR':roll<45?'R':'N';
 if(profile[pityKey]>=9&&['N','R'].includes(rarity))rarity='SR';
 profile[pityKey]=['SR','SSR'].includes(rarity)?0:profile[pityKey]+1;
 const candidates=options.filter(x=>x.rarity===rarity);
 const prize=candidates[Math.floor(Math.random()*candidates.length)]||options[0];
 const owned=type==='ship'?profile.ships:profile.bullets,duplicate=owned.includes(prize.id);
 const refund=duplicate?(type==='ship'?60:30):0;
 if(!duplicate)owned.push(prize.id);
 if(refund)profile.wallet+=refund;
 lootInfo={type,prize,duplicate,refund};
 shopNotice='';saveProfile();mode='opening';chestClock=0;
 sfx('gate');buzz(duplicate?60:[50,50,120]);
 say('獲得 '+prize.name+(duplicate?'，重複道具折抵金幣':'，已加入收藏'));
}
function equip(type,id){
 const owned=type==='ship'?profile.ships:profile.bullets;
 if(!owned.includes(id)){shopNotice='尚未解鎖，需透過寶箱取得';return}
 if(type==='ship')profile.ship=id;else profile.bullet=id;
 shopNotice='已裝備 '+(type==='ship'?currentShip().name:currentSkin().name);
 saveProfile();sfx('gate');
}

function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(Math.round(x1)+.5,Math.round(y1)+.5);ctx.lineTo(Math.round(x2)+.5,Math.round(y2)+.5);ctx.stroke()}
function txt(s,x,y,size=14,color=C.text,align='left',weight=800){
 ctx.textAlign=align;ctx.textBaseline='middle';ctx.font=weight+' '+size+'px ui-monospace,SFMono-Regular,Consolas,"Noto Sans TC","Microsoft JhengHei",sans-serif';
 ctx.fillStyle=color;ctx.fillText(String(s),Math.round(x),Math.round(y));
}
function bordered(x,y,w,h,fill='#142842',edge='#79a0bd',thick=3){
 rect(x,y,w,h,edge);rect(x+thick,y+thick,w-thick*2,h-thick*2,fill);
 rect(x+thick,y+thick,6,3,'#ffffff29');rect(x+w-thick-8,y+h-thick-3,8,3,'#0005');
}
function sprite(art,pal,x,y,s){
 for(let j=0;j<art.length;j++){for(let i=0;i<art[j].length;i++){const a=art[j][i];if(pal[a])rect(x+i*s,y+j*s,s,s,pal[a])}}
}
function say(s){announce.textContent=s}
function sfx(kind){
 if(muted)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(!audioContext)audioContext=new AC();
  if(audioContext.state==='suspended')audioContext.resume();
  const osc=audioContext.createOscillator(),gain=audioContext.createGain(),now=audioContext.currentTime;
  osc.type=kind==='shoot'?'square':kind==='hit'?'sawtooth':'triangle';
  const v=kind==='shoot'?520:kind==='hit'?140:kind==='gate'?780:kind==='win'?660:210;
  const d=kind==='shoot'?.035:kind==='hit'?.07:kind==='gate'?.16:.25;
  osc.frequency.setValueAtTime(v,now);
  osc.frequency.exponentialRampToValueAtTime(Math.max(50,v*(kind==='win'?1.4:.55)),now+d);
  gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(kind==='shoot'?.018:.048,now+.006);
  gain.gain.exponentialRampToValueAtTime(.0001,now+d);
  osc.connect(gain);gain.connect(audioContext.destination);osc.start(now);osc.stop(now+d+.02);
 }catch(e){}
}
function buzz(ms){if(navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}
function saveBest(){if(score>best){best=score;try{localStorage.setItem('gate-rush-best',String(best))}catch(e){}}}
function newRun(){
 player={x:180,y:600,hp:8,maxHp:8,power:8,lanes:1,interval:.29,inv:0};
 input.x=180;stage=1;score=0;kills=0;elapsed=0;earnedThisRun=0;stageCoins=0;
 baseMax=22;baseHp=baseMax;startStage();mode='play';
 say('遊戲開始！射擊閘門強化戰機，收集掉落金幣。');
}
function startStage(){
 stageTime=0;phase='waves';waveIndex=0;
 enemies=[];bullets=[];badBullets=[];gates=[];parts=[];texts=[];coins=[];chains=[];laserRays=[];boss=null;
 waveTimer=.6;gateTimer=3.4;shotTimer=.1;shake=0;hitFlash=0;stageCoins=0;
}
function stageEnd(){
 const reward=20+stage*5+10;
 gainCoins(reward);
 baseHp=Math.min(baseMax,baseHp+5);
 mode='clear';saveBest();sfx('win');buzz([40,40,70]);
 say('第 '+stage+' 關通關，獲得 '+reward+' 金幣，並修復基地耐久。');
}
function gameOver(reason){
 if(mode!=='play')return;mode='dead';endReason=reason||'防線失守';saveBest();sfx('hit');buzz(110);
 say('遊戲結束，總分'+score+'。');
}
function addText(s,x,y,col=C.yellow){texts.push({s,x,y,col,life:1.1})}
function burst(x,y,color,n=10){
 for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),speed=rand(35,130);
 parts.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:rand(.2,.65),max:.65,color,size:rand(2,5)})}
}
function makeEnemy(x,y,hp,kind=0,elite=false){
 const heavy=stage>=4&&Math.random()<.13,shield=heavy?Math.floor(hp*.6):0;
 return {id:++enemyId,x,y,hp,max:hp,shield,maxShield:shield,elite,
  heavy,speed:Math.max(32,51+stage*2+rand(-6,7)-(heavy?12:0)),
  kind,wobble:rand(0,10),baseX:x,amp:stage>=3?rand(9,23):rand(3,9),
  dive:stage>=5&&Math.random()<.14};
}
function spawnWave(){
 waveIndex++;
 const count=Math.min(9,1+Math.ceil(waveIndex*.84)+Math.floor((stage-1)/3));
 const rows=waveIndex>=8&&stage>=3?3:waveIndex>=6?2:1;
 const step=count>1?282/(count-1):0;
 for(let r=0;r<rows;r++)for(let c=0;c<count;c++){
  const hp=20+stage*10+Math.floor(waveIndex*2.5)+Math.floor(rand(0,5));
  const elite=stage>=3&&((c+r*count+waveIndex)%11===0);
  enemies.push(makeEnemy(39+c*step,-28-r*43,elite?Math.floor(hp*1.7):hp,
    (waveIndex+c+r)%bugPals.length,elite));
 }
}
function positiveGate(){
 // 降低每個閘門的起始獎勵，升級需要實際投入更多子彈
 const pool=[
  {type:'power',val:2,label:'攻擊',hits:0,width:102},
  {type:'lanes',val:1,label:'彈道',hits:0,width:102},
  {type:'speed',val:4,label:'攻速',hits:0,width:102},
  {type:'heal',val:1,label:'生命',hits:0,width:102}
 ];
 let p={...pool[Math.floor(Math.random()*pool.length)]};
 if(player.lanes>=12&&p.type==='lanes')p={...pool[0]};
 if(player.hp>=player.maxHp&&p.type==='heal')p={...pool[2]};
 return {...p,kind:'normal',lock:0,baseVal:p.val,lastHit:0,decay:0};
}
function modifiedGate(kind){
 const p=positiveGate();p.kind=kind;
 if(kind==='reverse'){
  p.val=p.type==='power'?-3:p.type==='lanes'?-2:p.type==='speed'?-9:-2;
  p.baseVal=p.val;
 }
 if(kind==='locked'){
  p.lock=8+stage*2;
  p.val+=p.type==='power'?1:p.type==='speed'?2:p.type==='heal'?1:0;
  p.baseVal=p.val;
 }
 return p;
}
function gateValue(p,hits=p.hits){
 // 不同能力有不同的升級節奏，14 次命中後達到 MAX。
 // 逆轉閘門需先將負數逐步提高，14 次內仍有機會轉正。
 const h=Math.min(14,Math.max(0,hits));
 if(p.kind==='reverse'){
  if(p.type==='power')return Math.min(45,p.baseVal+Math.floor(h/3));
  if(p.type==='lanes')return Math.min(6,p.baseVal+Math.floor(h/4));
  if(p.type==='speed')return Math.min(65,p.baseVal+Math.floor(h/3)*3);
  return Math.min(8,p.baseVal+Math.floor(h/4));
 }
 if(p.type==='power')return Math.min(45,p.baseVal+Math.floor(h/4));
 if(p.type==='lanes')return Math.min(6,p.baseVal+Math.floor(h/7));
 if(p.type==='speed')return Math.min(65,p.baseVal+Math.floor(h/4)*2);
 return Math.min(8,p.baseVal+Math.floor(h/7));
}
function upgradeGate(p,x,y,impact=1,kind='pulse',volley=0){
 if(p.lock<=0&&p.hits>=14)return;
 if(kind==='laser'&&elapsed-(p.lastLaser||-99)<.19)return;
 if(kind==='laser')p.lastLaser=elapsed;
 if(kind==='spread'){
  if(p.lastVolley!==volley){p.lastVolley=volley;p.volleyCount=0}
  if(p.volleyCount>=3)return;
  p.volleyCount++;
 }
 p.lastHit=elapsed;
 if(p.lock>0){
  p.lock=Math.max(0,p.lock-impact);
  if(!p.lock){burst(x,y,C.gold,20);addText('UNLOCK!',x,y-18,C.yellow);sfx('gate')}
  return;
 }
 const prev=p.val,prevHits=p.hits;
 p.hits=Math.min(14,p.hits+impact);
 p.width=Math.min(155,102+p.hits*4);
 p.val=gateValue(p);
 if(p.hits>prevHits&&p.hits%2===0)burst(x,y,p.type==='lanes'?C.blue:C.mint,3);
 if(p.val!==prev){
  if(prev<0&&p.val>=0)addText('轉正!',x,y-14,C.green);
  else addText('+'+(p.val-prev),x,y-14,C.yellow);
 }
 if(p.hits>=14&&prevHits<14){
  burst(x,y,C.white,12);
  addText('MAX 穿透',x,y-26,C.blue);
 }
}
function spawnGate(){
 let a=positiveGate(),b=positiveGate();
 for(let i=0;i<6&&a.type===b.type;i++)b=positiveGate();
 const roll=Math.random();
 if(stage>=2&&roll<.42){
  if(Math.random()<.5)a=modifiedGate('reverse');else b=modifiedGate('reverse');
 }else if(stage>=3&&roll<.73){
  if(Math.random()<.5)a=modifiedGate('locked');else b=modifiedGate('locked');
 }else if(stage>=5&&roll<.93){
  if(Math.random()<.5)a=modifiedGate('unstable');else b=modifiedGate('unstable');
 }
 gates.push({y:-58,left:a,right:b,glow:0});
}
function applyGate(g){
 if(g.lock>0){addText('LOCKED',player.x,player.y-101,C.red);sfx('hit');return}
 const val=g.val;
 const old={power:player.power,lanes:player.lanes,interval:player.interval,hp:player.hp};
 if(g.type==='power')player.power=clamp(player.power+val,3,120);
 if(g.type==='lanes')player.lanes=clamp(player.lanes+val,1,13);
 if(g.type==='speed')player.interval=clamp(player.interval/(1+val/100),.09,.8);
 if(g.type==='heal')player.hp=clamp(player.hp+val,0,player.maxHp);
 const gain=g.label+' '+(val>=0?'+':'')+val+(g.type==='speed'?'%':'');
 addText(gain,player.x,player.y-100,val>=0?C.green:C.red);
 burst(player.x,player.y-70,val>=0?C.green:C.red,16);
 shake=Math.max(shake,2);sfx(val>=0?'gate':'hit');buzz(25);
 if(player.hp<=0){gameOver('負數閘門耗盡生命');return}
 if(old.power!==player.power||old.lanes!==player.lanes||old.interval!==player.interval||old.hp!==player.hp)say('閘門效果 '+gain);
}
function spawnBoss(){
 phase='boss';enemies=[];gates=[];badBullets=[];boss={x:180,y:-85,hp:490+stage*360,max:490+stage*360,clock:0,fire:2.4};
 addText('警告！首領來襲',180,190,C.orange);shake=6;sfx('hit');
 say('首領來襲！');
}
function fireOne(angle,type,damage,extra={}){
 const speed=type==='laser'?1120:type==='rail'?600:type==='homing'?350:type==='plasma'?540:470;
 bullets.push({x:player.x+Math.sin(angle)*8,y:player.y-34,
  vx:Math.sin(angle)*speed,vy:-Math.cos(angle)*speed,
  damage:Math.max(1,Math.round(damage)),kind:type,age:0,volley:shotId,
  pierce:type==='rail'?4:0,hitIds:new Set(),...extra});
}
function shoot(){
 shotId++;
 const ship=currentShip().id,n=player.lanes;
 const arc=n===1?0:n===2?14:Math.min(68,22+(n-3)*5);
 if(ship==='spread'){
  const count=Math.min(27,5+2*(n-1)),range=Math.min(98,47+(n-1)*4);
  for(let i=0;i<count;i++)fireOne((-range/2+range*i/(count-1))*Math.PI/180,'spread',player.power*.38);
 }else if(ship==='laser'){
  const count=Math.min(3,1+Math.floor((n-1)/5));
  for(let i=0;i<count;i++){
   const a=(count===1?0:-15+30*i/(count-1))*Math.PI/180;
   fireOne(a,'laser',player.power*.72);
   laserRays.push({x:player.x,a,life:.2});
  }
 }else if(ship==='rail'){
  const count=Math.min(5,1+Math.floor((n-1)/3));
  for(let i=0;i<count;i++)fireOne((count===1?0:-arc/2+arc*i/(count-1))*Math.PI/180,'rail',player.power*3.2);
 }else if(ship==='homing'){
  const count=Math.min(6,1+Math.floor(n/2));

function hitEnemy(e,dmg){
 let damage=Math.max(1,dmg);
 if(e.shield>0){
  const absorbed=Math.min(e.shield,damage);
  e.shield-=absorbed;damage-=absorbed;
 }
 if(damage>0)e.hp-=damage;
 if(e.hp<=0){
  score+=10+stage*2+(e.elite?20:0);kills++;
  burst(e.x,e.y,e.elite?C.purple:C.gold,12);
  addText('+'+(10+stage*2),e.x,e.y-20,C.yellow);
  dropCoins(e);return true;
 }
 for(let i=0;i<2;i++)parts.push({x:e.x+rand(-8,8),y:e.y+rand(-8,8),
  vx:rand(-28,28),vy:rand(-50,-10),life:.2,max:.2,color:e.shield>0?C.blue:C.white,size:3});
 return false;
}
function chainAttack(origin,exclude){
 let hit=new Set([exclude.id]),from=exclude;
 const count=Math.min(5,1+Math.floor((player.lanes-1)/2));
 for(let i=0;i<count;i++){
  let next=null,dist=85;
  for(const e of enemies){const d=Math.hypot(e.x-from.x,e.y-from.y);
   if(!hit.has(e.id)&&d<dist){dist=d;next=e}}
  if(!next)break;
  chains.push({x1:from.x,y1:from.y,x2:next.x,y2:next.y,life:.19});
  hit.add(next.id);
  if(hitEnemy(next,Math.max(1,Math.floor(origin*.65)))){
   const idx=enemies.indexOf(next);if(idx>=0)enemies.splice(idx,1);
  }
  from=next;
 }
}

function update(dt){
 backScroll+=dt*(mode==='play'?50:15);
 for(let i=parts.length-1;i>=0;i--){
  const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=115*dt;p.life-=dt;
  if(p.life<=0)parts.splice(i,1);
 }
 for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=32*dt;t.life-=dt;if(t.life<=0)texts.splice(i,1)}
 for(let i=chains.length-1;i>=0;i--){chains[i].life-=dt;if(chains[i].life<=0)chains.splice(i,1)}
 for(let i=laserRays.length-1;i>=0;i--){laserRays[i].life-=dt;if(laserRays[i].life<=0)laserRays.splice(i,1)}
 shake=Math.max(0,shake-20*dt);hitFlash=Math.max(0,hitFlash-dt);
 if(mode==='opening'){
  chestClock+=dt;
  if(chestClock>=1.05){
   mode='loot';sfx(lootInfo.duplicate?'gate':'win');
   burst(180,313,RARITY[lootInfo.prize.rarity].color,42);
   addText(lootInfo.prize.rarity+'!',180,246,RARITY[lootInfo.prize.rarity].color);
  }
  return;
 }
 if(mode!=='play')return;
 elapsed+=dt;stageTime+=dt;player.inv=Math.max(0,player.inv-dt);
 if(input.left)input.x-=210*dt;
 if(input.right)input.x+=210*dt;
 input.x=clamp(input.x,37,323);
 player.x+=(input.x-player.x)*Math.min(1,dt*18);
 player.x=clamp(player.x,37,323);
 if(phase==='waves'){
  waveTimer-=dt;gateTimer-=dt;
  if(waveTimer<=0){spawnWave();waveTimer=Math.max(2.6,4.4-stage*.12-waveIndex*.1)}
  if(gateTimer<=0){spawnGate();gateTimer=7.5}
  if(stageTime>=36)spawnBoss();
 }
 const cadence=Math.max(.085,player.interval*currentShip().rate);
 shotTimer-=dt;
 if(shotTimer<=0){shoot();shotTimer+=cadence;if(shotTimer<=0)shotTimer=cadence}
 // 閘門自頂向下，玩家到達時領取；上鎖未解鎖則失效
 for(let i=gates.length-1;i>=0;i--){
  const g=gates[i];g.y+=91*dt;g.glow+=dt;
  for(const p of [g.left,g.right]){
   if(p.kind==='unstable'&&p.hits>0&&elapsed-p.lastHit>.85){
    p.decay+=dt;
    if(p.decay>=1.0){
     p.decay=0;p.hits=Math.max(0,p.hits-1);
     p.width=Math.max(102,p.width-4);
     p.val=gateValue(p);
    }
   }else p.decay=0;
  }
  if(g.y>=player.y-88){
   const chosen=[{p:g.left,cx:99},{p:g.right,cx:261}]
    .find(item=>Math.abs(player.x-item.cx)<=item.p.width/2+12);
   if(chosen)applyGate(chosen.p);
   else addText('MISSED',player.x,player.y-95,C.red);
   gates.splice(i,1);
  }else if(g.y>FIELD_BOTTOM)gates.splice(i,1);
 }
 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];e.y+=e.speed*dt;e.wobble+=dt;
  const amp=e.dive?e.amp+Math.min(34,stageTime):e.amp;
  e.x=clamp(e.baseX+Math.sin(e.wobble*(e.dive?2.8:1.7))*amp,30,330);
  if(e.y>=player.y-18&&e.y<player.y+19&&Math.abs(e.x-player.x)<22){
   loseHealth(e.heavy?2:1);enemies.splice(i,1);continue;
  }
  if(e.y>FIELD_BOTTOM-19){
   baseHp=Math.max(0,baseHp-(e.heavy?2:1));
   burst(e.x,FIELD_BOTTOM-18,C.red,7);
   addText('-'+(e.heavy?2:1)+' BASE',e.x,FIELD_BOTTOM-30,C.red);
   enemies.splice(i,1);shake=Math.max(shake,2);
   if(baseHp<=0){gameOver('防線耐久歸零');break}
  }
 }
 if(mode!=='play')return;
 if(boss){
  boss.clock+=dt;boss.y+=(138-boss.y)*Math.min(1,dt*1.35);
  boss.x=180+Math.sin(boss.clock*.9)*100;
  if(boss.y>118){
   boss.fire-=dt;
   if(boss.fire<=0){
    for(let i=-1;i<=1;i++){
     const dx=player.x-boss.x,dy=player.y-boss.y,mag=Math.hypot(dx,dy)||1;
     badBullets.push({x:boss.x+i*20,y:boss.y+32,vx:dx/mag*100+i*40,vy:dy/mag*190});
    }
    boss.fire=Math.max(.75,1.8-stage*.075);
   }
  }
 }
 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];b.age+=dt;
  if(b.kind==='homing'&&b.age>.23){
   let target=null,dd=1e9;
   for(const e of enemies){
    if(e.y>=b.y+14)continue;
    const d=Math.hypot(e.x-b.x,e.y-b.y);
    if(d<dd){dd=d;target=e}
   }
   if(boss&&boss.y<b.y){target=boss}
   if(target){
    const dx=target.x-b.x,dy=target.y-b.y,m=Math.hypot(dx,dy)||1;
    b.vx+=(dx/m*350-b.vx)*Math.min(1,dt*5);
    b.vy+=(dy/m*350-b.vy)*Math.min(1,dt*5);
   }
  }
  const oldY=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.y<FIELD_TOP||b.x<17||b.x>343||b.age>3){bullets.splice(i,1);continue}
  let used=false;
  // 閘門優先吸收子彈，雷射按時間計數、散彈每輪最多累積三次
  for(const g of gates){
   if(Math.min(oldY,b.y)<=g.y+52&&Math.max(oldY,b.y)>=g.y-5){
    for(const [p,cx] of [[g.left,99],[g.right,261]]){
     if(Math.abs(b.x-cx)<=p.width/2){
      // 已升到 MAX 且解鎖的閘門不再吞彈，可繼續命中上方敵人
      if(p.lock<=0&&p.hits>=14)continue;
      upgradeGate(p,b.x,b.y,b.kind==='rail'?2:1,b.kind,b.volley);
      used=true;break;
     }
    }
   }
   if(used)break;
  }
  if(used){bullets.splice(i,1);continue}
  const pad=b.kind==='rail'?8:b.kind==='homing'?9:5;
  if(boss&&boss.y>60&&Math.abs(b.x-boss.x)<43+pad&&Math.abs(b.y-boss.y)<31+pad){
   boss.hp-=b.damage;used=true;
   if(Math.random()<.25)burst(b.x,b.y,currentSkin().color,2);
   if(boss.hp<=0){
    score+=150*stage;kills++;burst(boss.x,boss.y,C.gold,45);
    boss=null;bullets.splice(i,1);stageEnd();break;
   }
  }else{
   for(let j=enemies.length-1;j>=0;j--){
    const e=enemies[j];
    if(Math.abs(b.x-e.x)<15+pad*.3&&Math.abs(b.y-e.y)<14+pad*.3&&!b.hitIds.has(e.id)){
     b.hitIds.add(e.id);
     const dead=hitEnemy(e,b.damage);
     if(b.kind==='plasma')chainAttack(b.damage,e);
     if(dead)enemies.splice(j,1);
     if(b.pierce>0){b.pierce--;}else used=true;
     break;
    }
   }
  }
  if(used)bullets.splice(i,1);
 }
 // 撿取金幣才會存入錢包，未拾取的金幣離開畫面即消失
 let collected=0;
 for(let i=coins.length-1;i>=0;i--){
  const c=coins[i];c.y+=c.vy*dt;c.wobble+=dt;
  c.x+=Math.sin(c.wobble*5)*8*dt;
  if(Math.abs(c.x-player.x)<28&&Math.abs(c.y-(player.y-10))<32){
   collected+=c.value;coins.splice(i,1);
  }else if(c.y>FIELD_BOTTOM-10)coins.splice(i,1);
 }
 if(collected){gainCoins(collected);addText('+'+collected+'G',player.x,player.y-57,C.gold);sfx('gate')}
 for(let i=badBullets.length-1;i>=0;i--){
  const b=badBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.y>660||b.x<15||b.x>345){badBullets.splice(i,1);continue}
  if(Math.abs(b.x-player.x)<18&&Math.abs(b.y-(player.y-17))<21){
   loseHealth(1);badBullets.splice(i,1);
  }
 }
}

function render(){
 ctx.save();
 if(mode==='menu'){drawMenu();ctx.restore();return}
 if(mode==='hangar'){drawHangar();ctx.restore();return}
 if(mode==='opening'){drawOpening();ctx.restore();return}
 if(mode==='loot'){drawLoot();ctx.restore();return}
 if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 background();
 for(const g of gates)drawGate(g);
 for(const e of enemies)drawEnemy(e);
 drawBoss();drawCoins();drawBullets();drawCat();drawEffects();
 ctx.restore();drawHud();
 if(mode==='clear')drawClear();
 if(mode==='dead')drawDead();
 if(mode==='paused')drawPaused();
}
function handleTap(x,y){
 if(mode==='menu'){
  if(y>=445&&y<=505&&x>=50&&x<=310){newRun();return}
  if(y>=507&&y<=571&&x>=50&&x<=310){hangarTab='ship';shopNotice='';mode='hangar';return}
  return;
 }
 if(mode==='hangar'){
  if(x>=290&&y<78){mode='menu';return}
  if(y>=95&&y<=148){hangarTab=x<180?'ship':'bullet';shopNotice='';return}
  if(y>=503&&y<=568){if(x<=180)openChest('ship');else openChest('bullet');return}
  if(y>=157&&y<=481){
   const col=x<181?0:1,base=col===0?22:187;
   const row=Math.floor((y-157)/111),inY=(y-157)%111;
   if(x>=base&&x<=base+150&&inY<=102&&row>=0&&row<3){
    const i=row*2+col,p=(hangarTab==='ship'?SHIPS:SKINS)[i];
    if(p)equip(hangarTab,p.id);
   }
  }
  return;
 }
 if(mode==='loot'){
  if(y>=447&&y<=501){openChest(lootInfo.type);return}
  if(y>=508&&y<=565){mode='hangar';shopNotice='';return}
  return;
 }
 if(mode==='dead'){
  if(y>=418&&y<=480){newRun();return}
  if(y>=487&&y<=551){mode='menu';return}
  return;
 }
 if(mode==='clear'){
  if(y>=398&&y<=505){if(x>=40&&x<180)nextStage(0);else if(x>180&&x<322)nextStage(1)}
  return;
 }
 if(mode==='paused'){
  if(y>=320&&y<=382){mode='play';return}
  if(y>=389&&y<=447){newRun();return}
  if(y>=451&&y<=508){mode='menu';return}
  return;
 }
 if(mode==='play'&&x>318&&y<54){mode='paused';say('遊戲暫停');return}
}
function eventPoint(event){
 const r=canvas.getBoundingClientRect();
 return {x:(event.clientX-r.left)/r.width*W,y:(event.clientY-r.top)/r.height*H};
}
canvas.addEventListener('pointerdown',e=>{
 e.preventDefault();canvas.focus({preventScroll:true});
 const p=eventPoint(e);
 if(mode==='play'&&!(p.x>318&&p.y<54)){
  input.down=true;input.x=clamp(p.x,37,323);
  try{canvas.setPointerCapture(e.pointerId)}catch(err){}
 }else handleTap(p.x,p.y);
});
canvas.addEventListener('pointermove',e=>{
 if(!input.down||mode!=='play')return;
 const p=eventPoint(e);input.x=clamp(p.x,37,323);
});
function release(){input.down=false}
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);
window.addEventListener('blur',()=>{release();input.left=false;input.right=false;if(mode==='play')mode='paused'});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')mode='paused'});
window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight',' ','Enter','Escape','a','d','A','D','p','P'].includes(e.key))e.preventDefault();
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')input.left=true;
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')input.right=true;
 if(e.repeat)return;
 if(mode==='menu'&&(e.key==='Enter'||e.key===' '))newRun();
 else if(mode==='dead'&&(e.key==='Enter'||e.key===' '))newRun();
 else if(mode==='clear'&&e.key==='1')nextStage(0);
 else if(mode==='clear'&&e.key==='2')nextStage(1);
 else if((e.key==='p'||e.key==='P'||e.key==='Escape')&&mode==='play')mode='paused';
 else if((e.key==='p'||e.key==='P'||e.key==='Escape')&&mode==='paused')mode='play';
 else if(mode==='paused'&&(e.key==='Enter'||e.key===' '))mode='play';
});
window.addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')input.left=false;
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')input.right=false;
});
function frame(t){
 if(!lastFrame)lastFrame=t;
 let dt=Math.min(.05,(t-lastFrame)/1000);lastFrame=t;
 update(dt);render();requestAnimationFrame(frame);
}
player={x:180,y:600,hp:8,maxHp:8,power:8,lanes:1,interval:.29,inv:0};
requestAnimationFrame(frame);
})();
