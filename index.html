 if(name==='radio'){s.heard=s.channel===2;beep(s.heard?630:200,.12);renderScene();return;}
 if(name==='film'){film(val);return;}
 if(name==='gear'){let k=+val;s.gear[k]=(s.gear[k]+1)%4;s.gear[(k+1)%4]=(s.gear[(k+1)%4]+3)%4;beep(430,.06);renderScene();return;}
 if(name==='switch'){s.switches[+val]=!s.switches[+val];beep(s.switches[+val]?540:310,.05);renderScene();return;}
 if(name==='light'){flip(s.cells,+val);beep(s.cells[+val]?590:330,.05);renderScene();return;}
 if(name==='move'){move(val);return;}
 if(name==='undo'&&g.level===9){const prev=s.history.pop();if(prev){s.p=prev.p;s.box=prev.box;s.world=prev.world;s.lit=prev.lit;renderScene();}return;}
 if(name==='world'&&g.level===9){
  const w=s.world==='normal'?'shadow':'normal';
  if(!walk(w,...s.p)||!walk(w,...s.box)){g.notice='那一邊有牆壁擋住了去路。';renderKeypad();return;}
  s.history.push({p:s.p.slice(),box:s.box.slice(),world:s.world,lit:{...s.lit}});
  s.world=w;if(w==='shadow'&&WORLD_PADS.some(x=>same(x,s.box)))s.lit[s.box.join(',')]=true;
  beep(690,.05);renderScene();return;
 }
 if(name==='verdict'){s.verdict=val;beep(430,.04);renderScene();return;}
}

 $('stage').innerHTML=body;$('nextArea').innerHTML='';
}
document.addEventListener('click',e=>{const x=e.target.closest('[data-action]');if(x&&!x.disabled)act(x.dataset.action,x.dataset.value);});
document.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,[contenteditable="true"]'))return;
 const dir={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',a:'L',s:'D',d:'R',W:'U',A:'L',S:'D',D:'R'};
 if(dir[e.key]&&g.level===9&&!g.archive&&!g.done){e.preventDefault();move(dir[e.key]);return;}
 if(/^[0-9]$/.test(e.key))key(e.key);
 else if(e.key==='Backspace'){e.preventDefault();key('X');}
 else if(e.key==='Enter')key('OK');
});
load(g.level);
})();
