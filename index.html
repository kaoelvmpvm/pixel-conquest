<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1223">
<meta name="description" content="像素火線 GATE RUSH：自動射擊、左右選擇強化閘門、擊退敵軍與首領的直向像素動作遊戲。">
<title>像素火線 | GATE RUSH</title>
<style>
:root{color-scheme:dark;background:#080e18}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:radial-gradient(ellipse at 50% 30%,#203550 0,#0a1323 55%,#05090f 100%);color:#fff}
#shell{position:relative;width:min(100vw,calc(100dvh * .5));aspect-ratio:1/2;max-height:100dvh;overflow:hidden;box-shadow:0 0 0 2px #263c52,0 12px 80px #0009;touch-action:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;outline:none}
#announce{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (max-aspect-ratio:1/2){#shell{width:100vw;max-height:100dvh}}
</style>
</head>
<body>
<main id="shell" aria-label="像素火線遊戲。拖曳左右移動，自動射擊。">
<canvas id="game" width="360" height="720" tabindex="0" aria-label="像素火線，左右移動射擊"></canvas>
<div id="announce" aria-live="polite"></div>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d',{alpha:false});
const announce=document.getElementById('announce');
const W=360,H=720,FIELD_TOP=72,FIELD_BOTTOM=660;
ctx.imageSmoothingEnabled=false;
const C={
 dark:'#0a1020',deep:'#101b2e',sky:'#365b83',brick:'#729dc3',brick2:'#638eb8',
 border:'#b1d3e4',steel:'#223955',white:'#f8f5dc',text:'#e9f5ff',
 yellow:'#ffe68c',gold:'#ffc65b',orange:'#ff964e',red:'#ff626c',
 green:'#90f3a3',mint:'#55dcb3',blue:'#7ed8ff',purple:'#bd9df8'
};
const catArt=[
'......OO...OO......',
'.....OYYO.OYYO.....',
'....OYYYYYYYYYO....',
'....OYYYYYYYYYO....',
'...OYYYYYYYYYYYO...',
'...OYWYYWWYYWYYO...',
'...OYWYYWWYYWYYO...',
'...OYYYYPYYYYYYO...',
'...OYYYYYYYYYYYO...',
'....OYYKKKYYYO....',
'....OYYYYYYYYYO....',
'.....OOOOOOOOO.....',
'......OTTTTTO......',
'......OTTTTTO......',
'.....OOTTTTTOO.....',
'.....OOTTOTTOO.....'
];
const catPal={O:'#493b46',Y:'#f5b45e',W:'#fff7df',P:'#f37b88',K:'#3c303d',T:'#694b44'};
const botArt=[
'...OOOOOOO...',
'..OYYYYYYYO..',
'.OOYYYYYYYOO.',
'.OYYYWWYYYYO.',
'.OYYYWWYYYYO.',
'.OYYOKKOYYYO.',
'.OOOYYYYYOOO.',
'ORRROTTTORRRO',
'ORRROTTTORRRO',
'.OOTTGGGTTO..',
'..OOO...OOO..'
];
const botPal={O:'#33384f',Y:'#eac75a',W:'#f9f6dd',K:'#24253a',R:'#eb5668',T:'#858b9e',G:'#6fd99c'};
let audioContext=null,muted=false,sfxTick=0;
const input={x:180,down:false,left:false,right:false};
let player=null,enemies=[],bullets=[],badBullets=[],gates=[],parts=[],texts=[];
let boss=null,mode='menu',stage=1,stageTime=0,elapsed=0,score=0,kills=0;
let best=0,waveTimer=0,gateTimer=0,shotTimer=0,shake=0,hitFlash=0,phase='waves',endReason='',finishChoice=0;
let lastFrame=0,backScroll=0,gameSeed=0;
try{best=Number(localStorage.getItem('gate-rush-best'))||0}catch(e){}
function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(Math.round(x1)+.5,Math.round(y1)+.5);ctx.lineTo(Math.round(x2)+.5,Math.round(y2)+.5);ctx.stroke()}
function txt(s,x,y,size=14,color=C.text,align='left',weight=800){
 ctx.textAlign=align;ctx.textBaseline='middle';ctx.font=weight+' '+size+'px system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif';
 ctx.fillStyle=color;ctx.fillText(String(s),Math.round(x),Math.round(y));
}
function bordered(x,y,w,h,fill='#142842',edge='#79a0bd',thick=3){
 rect(x,y,w,h,edge);rect(x+thick,y+thick,w-thick*2,h-thick*2,fill);
 rect(x+thick,y+thick,6,3,'#ffffff29');rect(x+w-thick-8,y+h-thick-3,8,3,'#0005');
}
function sprite(art,pal,x,y,s){
 for(let j=0;j<art.length;j++){for(let i=0;i<art[j].length;i++){const a=art[j][i];if(pal[a])rect(x+i*s,y+j*s,s,s,pal[a])}}
}
function say(s){announce.textContent=s}
function sfx(kind){
 if(muted)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(!audioContext)audioContext=new AC();
  if(audioContext.state==='suspended')audioContext.resume();
  const osc=audioContext.createOscillator(),gain=audioContext.createGain(),now=audioContext.currentTime;
  osc.type=kind==='shoot'?'square':kind==='hit'?'sawtooth':'triangle';
  const v=kind==='shoot'?520:kind==='hit'?140:kind==='gate'?780:kind==='win'?660:210;
  const d=kind==='shoot'?.035:kind==='hit'?.07:kind==='gate'?.16:.25;
  osc.frequency.setValueAtTime(v,now);
  osc.frequency.exponentialRampToValueAtTime(Math.max(50,v*(kind==='win'?1.4:.55)),now+d);
  gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(kind==='shoot'?.018:.048,now+.006);
  gain.gain.exponentialRampToValueAtTime(.0001,now+d);
  osc.connect(gain);gain.connect(audioContext.destination);osc.start(now);osc.stop(now+d+.02);
 }catch(e){}
}
function buzz(ms){if(navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}
function saveBest(){if(score>best){best=score;try{localStorage.setItem('gate-rush-best',String(best))}catch(e){}}}
function newRun(){
 player={x:180,y:600,hp:8,maxHp:8,power:8,lanes:1,interval:.29,inv:0};
 input.x=180;stage=1;score=0;kills=0;elapsed=0;
 startStage();mode='play';say('遊戲開始，拖曳移動，靠近強化閘門。');
}
function startStage(){
 stageTime=0;phase='waves';enemies=[];bullets=[];badBullets=[];gates=[];parts=[];texts=[];boss=null;
 waveTimer=.5;gateTimer=4.4;shotTimer=.1;shake=0;hitFlash=0;
}
function stageEnd(){
 mode='clear';saveBest();sfx('win');buzz([40,40,70]);finishChoice=0;
 say('第'+stage+'關完成。選擇獎勵前往下一關。');
}
function gameOver(reason){
 if(mode!=='play')return;mode='dead';endReason=reason||'防線失守';saveBest();sfx('hit');buzz(110);
 say('遊戲結束，總分'+score+'。');
}
function addText(s,x,y,col=C.yellow){texts.push({s,x,y,col,life:1.1})}
function burst(x,y,color,n=10){
 for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),speed=rand(35,130);
 parts.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:rand(.2,.65),max:.65,color,size:rand(2,5)})}
}
function makeEnemy(x,y,hp,kind='bot'){return {x,y,hp,max:hp,speed:rand(42,51)+stage*4,kind,wobble:rand(0,10)}}
function spawnWave(){
 const count=Math.min(5,4+Math.floor((stage+1)/2)),rows=stage>=2&&Math.random()<.5?2:1;
 const step=count===1?0:260/(count-1);
 for(let r=0;r<rows;r++)for(let c=0;c<count;c++){
  const hp=Math.round(16+stage*7+r*5+Math.random()*5);
  enemies.push(makeEnemy(50+c*step,-24-r*39,hp));
 }
}
function positiveGate(){
 const pool=[
  {type:'power',val:rand(3,7)|0,label:'攻擊 +',good:true},
  {type:'lanes',val:1+(Math.random()<.35?1:0),label:'彈道 +',good:true},
  {type:'speed',val:12+(Math.random()*7|0),label:'攻速 +',good:true},
  {type:'heal',val:2,label:'生命 +',good:true}
 ];
 let g=pool[Math.random()*pool.length|0];
 if(player.lanes>=12&&g.type==='lanes')g=pool[0];
 if(player.hp>=player.maxHp&&g.type==='heal')g=pool[1];
 return g;
}
function negativeGate(){
 const pool=[
  {type:'power',val:-Math.min(5,Math.max(1,player.power-3)),label:'攻擊 ',good:false},
  {type:'lanes',val:-Math.min(2,Math.max(0,player.lanes-1)),label:'彈道 ',good:false},
  {type:'speed',val:-14,label:'攻速 ',good:false}
 ];
 const eligible=pool.filter(p=>p.val!==0);
 return eligible[Math.random()*eligible.length|0]||pool[0];
}
function spawnGate(){
 let a=positiveGate(),b=positiveGate();
 for(let i=0;i<4&&a.type===b.type;i++)b=positiveGate();
 if(stage>1&&Math.random()<.28){if(Math.random()<.5)a=negativeGate();else b=negativeGate()}
 gates.push({y:-55,left:a,right:b,done:false,glow:0});
}
function applyGate(g){
 const old={power:player.power,lanes:player.lanes,interval:player.interval,hp:player.hp};
 if(g.type==='power')player.power=clamp(player.power+g.val,3,120);
 if(g.type==='lanes')player.lanes=clamp(player.lanes+g.val,1,13);
 if(g.type==='speed')player.interval=clamp(player.interval/(1+g.val/100),.09,.65);
 if(g.type==='heal')player.hp=Math.min(player.maxHp,player.hp+g.val);
 const change=old.power!==player.power||old.lanes!==player.lanes||old.interval!==player.interval||old.hp!==player.hp;
 const textLabel=g.label+(g.val>0&&g.label.endsWith(' ')?'+':'')+g.val;
 addText(textLabel,player.x,player.y-100,g.good?C.green:C.red);
 burst(player.x,player.y-75,g.good?C.green:C.red,20);
 shake=Math.max(shake,3);sfx('gate');buzz(30);
 if(change)say('獲得'+textLabel);
}
function spawnBoss(){
 phase='boss';enemies=[];gates=[];badBullets=[];boss={x:180,y:-85,hp:360+stage*210,max:360+stage*210,clock:0,fire:2.4};
 addText('警告！首領來襲',180,190,C.orange);shake=6;sfx('hit');
 say('首領來襲！');
}
function shoot(){
 const n=player.lanes,spacing=n<=5?11:n<=9?9:7;
 for(let i=0;i<n;i++){
  bullets.push({x:player.x+(i-(n-1)/2)*spacing,y:player.y-44,vx:(i-(n-1)/2)*2,vy:-435,damage:player.power,trail:rand(0,6)});
 }
 for(let i=0;i<3;i++)parts.push({x:player.x+15,y:player.y-37,vx:rand(-20,20),vy:rand(-80,-35),life:.12,max:.12,color:C.yellow,size:3});
 if(++sfxTick%4===0)sfx('shoot');
}
function loseHealth(n=1){
 if(player.inv>0||mode!=='play')return;
 player.hp=Math.max(0,player.hp-n);player.inv=1.25;hitFlash=.3;shake=7;
 burst(player.x,player.y-24,C.red,16);sfx('hit');buzz(80);
 if(player.hp<=0)gameOver('生命耗盡');
}
function hitEnemy(e,dmg){
 e.hp-=dmg;
 if(e.hp<=0){
  score+=10+stage*2;kills++;burst(e.x,e.y,C.gold,12);addText('+'+(10+stage*2),e.x,e.y-20,C.yellow);
  return true;
 }
 for(let i=0;i<3;i++)parts.push({x:e.x+rand(-8,8),y:e.y+rand(-8,8),vx:rand(-28,28),vy:rand(-50,-10),life:.2,max:.2,color:C.white,size:3});
 return false;
}
function nextStage(choice){
 if(choice===0)player.lanes=Math.min(13,player.lanes+1);
 if(choice===1)player.hp=Math.min(player.maxHp,player.hp+3);
 stage++;startStage();mode='play';say('第'+stage+'關開始');
}
function update(dt){
 backScroll+=dt*(mode==='play'?50:15);
 for(let i=parts.length-1;i>=0;i--){
  const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=115*dt;p.life-=dt;
  if(p.life<=0)parts.splice(i,1);
 }
 for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=32*dt;t.life-=dt;if(t.life<=0)texts.splice(i,1)}
 if(shake>0)shake=Math.max(0,shake-20*dt);
 if(hitFlash>0)hitFlash=Math.max(0,hitFlash-dt);
 if(mode!=='play')return;
 elapsed+=dt;stageTime+=dt;player.inv=Math.max(0,player.inv-dt);
 if(input.left)input.x-=210*dt;
 if(input.right)input.x+=210*dt;
 input.x=clamp(input.x,37,323);
 player.x+=(input.x-player.x)*Math.min(1,dt*18);
 player.x=clamp(player.x,37,323);
 if(phase==='waves'){
  waveTimer-=dt;gateTimer-=dt;
  if(waveTimer<=0){spawnWave();waveTimer=Math.max(3.4,5.2-stage*.12)}
  if(gateTimer<=0){spawnGate();gateTimer=9.4}
  if(stageTime>=33){spawnBoss()}
 }
 shotTimer-=dt;
 if(shotTimer<=0){shoot();shotTimer+=player.interval;if(shotTimer<=0)shotTimer=player.interval}
 for(let i=gates.length-1;i>=0;i--){
  const g=gates[i];g.y+=97*dt;g.glow+=dt;
  if(!g.done&&g.y>=player.y-81){
   g.done=true;applyGate(player.x<180?g.left:g.right);gates.splice(i,1);
  } else if(g.y>FIELD_BOTTOM)gates.splice(i,1);
 }
 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];e.y+=e.speed*dt;e.wobble+=dt;
  if(e.y>player.y-10){
   if(Math.abs(e.x-player.x)<25)loseHealth(1);
   enemies.splice(i,1);
  }
 }
 if(boss){
  boss.clock+=dt;boss.y+=(138-boss.y)*Math.min(1,dt*1.35);
  boss.x=180+Math.sin(boss.clock*.9)*100;
  if(boss.y>118){
   boss.fire-=dt;
   if(boss.fire<=0){
    for(let i=-1;i<=1;i++){
     const dx=player.x-boss.x,dy=player.y-boss.y,mag=Math.hypot(dx,dy)||1;
     badBullets.push({x:boss.x+i*20,y:boss.y+32,vx:dx/mag*100+i*40,vy:dy/mag*190});
    }
    boss.fire=Math.max(.78,1.8-stage*.08);
   }
  }
 }
 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.y<FIELD_TOP||b.x<17||b.x>343){bullets.splice(i,1);continue}
  let used=false;
  if(boss&&boss.y>60&&Math.abs(b.x-boss.x)<45&&Math.abs(b.y-boss.y)<34){
   boss.hp-=b.damage;used=true;
   if(Math.random()<.35)burst(b.x,b.y,C.blue,2);
   if(boss.hp<=0){
    score+=150*stage;kills++;burst(boss.x,boss.y,C.gold,55);boss=null;bullets.splice(i,1);stageEnd();break;
   }
  } else {
   for(let j=enemies.length-1;j>=0;j--){
    const e=enemies[j];
    if(Math.abs(b.x-e.x)<17&&Math.abs(b.y-e.y)<16){
     if(hitEnemy(e,b.damage))enemies.splice(j,1);
     used=true;break;
    }
   }
  }
  if(used)bullets.splice(i,1);
 }
 for(let i=badBullets.length-1;i>=0;i--){
  const b=badBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.y>660||b.x<15||b.x>345){badBullets.splice(i,1);continue}
  if(Math.abs(b.x-player.x)<18&&Math.abs(b.y-(player.y-17))<21){
   loseHealth(1);badBullets.splice(i,1);
  }
 }
}
function background(){
 rect(0,0,W,H,C.deep);
 rect(13,FIELD_TOP,334,FIELD_BOTTOM-FIELD_TOP,'#537ba5');
 const off=Math.floor(backScroll%30);
 for(let y=FIELD_TOP-30+off;y<FIELD_BOTTOM;y+=30){
  const row=(Math.floor((y-off)/30)%2+2)%2;
  for(let x=17-(row?25:0);x<346;x+=50){
   rect(x+2,y+2,47,26,(row?'#628db7':'#6b97c0'));
   rect(x+3,y+3,44,2,'#8cb6d4');rect(x+2,y+27,47,2,'#355b84');
   rect(x+49,y+2,2,27,'#3d648c');
  }
 }
 const symbolY=155+(backScroll*.27%450);
 rect(75,symbolY,210,190,'#ffffff0a');
 for(let a=0;a<10;a++){
  const angle=a*Math.PI/5;
  const cx=180+Math.cos(angle)*66,cy=symbolY+92+Math.sin(angle)*66;
  rect(cx-8,cy-8,16,16,'#bedcef17');
 }
 rect(158,symbolY+67,44,44,'#b0d9f022');
 for(let y=FIELD_TOP-60+backScroll%90;y<FIELD_BOTTOM;y+=90){
  rect(0,y,18,78,'#283e62');rect(342,y,18,78,'#283e62');
  rect(8,y+9,6,55,'#94c5de');rect(346,y+9,6,55,'#94c5de');
  rect(0,y+20,6,12,'#cfdbdc');rect(354,y+20,6,12,'#cfdbdc');
 }
 rect(17,FIELD_TOP,3,FIELD_BOTTOM-FIELD_TOP,'#d1e5eb');
 rect(340,FIELD_TOP,3,FIELD_BOTTOM-FIELD_TOP,'#d1e5eb');
 rect(17,640,326,18,'#705341');rect(17,643,326,6,'#b78a5e');
 for(let x=18;x<345;x+=33){rect(x,650,30,13,'#956b4c');rect(x+27,650,3,13,'#503c40');rect(x+3,654,5,5,'#c28d63')}
}
function drawCat(){
 const flick=player.inv>0&&Math.floor(elapsed*14)%2===0;
 if(flick)return;
 const x=player.x,y=player.y;
 rect(x-28,y+9,56,9,'#132b3b9e');
 sprite(catArt,catPal,Math.round(x-28),Math.round(y-31),3);
 rect(x+16,y-42,11,39,'#222b3e');rect(x+19,y-49,5,30,'#7d879b');
 rect(x+17,y-40,5,8,'#ccd8d7');rect(x+20,y-49,4,3,'#d5f5ff');
 rect(x+12,y-4,15,7,'#4c4151');
 if(mode==='play'&&Math.sin(elapsed*35)>0.4){
  rect(x+16,y-55,11,5,C.yellow);rect(x+20,y-61,4,7,C.orange);
 }
}
function drawEnemy(e){
 const x=Math.round(e.x),y=Math.round(e.y);
 rect(x-14,y+12,28,4,'#12375a6e');
 sprite(botArt,botPal,x-13,y-12,2);
 if(e.hp<e.max){rect(x-17,y-23,34,5,C.dark);rect(x-16,y-22,32*clamp(e.hp/e.max,0,1),3,C.red)}
 txt(Math.ceil(e.hp),x,y-28,11,C.white,'center');
}
function drawBoss(){
 if(!boss)return;
 const x=Math.round(boss.x),y=Math.round(boss.y);
 bordered(x-46,y-34,92,68,'#3c4a56','#1b2a40',5);
 rect(x-52,y-22,9,39,C.red);rect(x+43,y-22,9,39,C.red);
 rect(x-33,y-23,66,18,'#c6d6aa');rect(x-29,y-19,24,10,'#bd83e2');rect(x+5,y-19,24,10,'#82dba2');
 rect(x-29,y+1,58,21,'#203049');rect(x-23,y+6,17,7,C.red);rect(x+6,y+6,17,7,C.red);
 for(let i=0;i<6;i++){rect(x-33+i*11,y+21,7,8,C.white)}
 rect(x-39,y-42,78,6,C.dark);rect(x-36,y-41,72*clamp(boss.hp/boss.max,0,1),4,C.orange);
 txt('機械暴君',x,y-56,13,C.yellow,'center');
}
function drawBullets(){
 for(const b of bullets){
  rect(b.x-2,b.y+5,4,13,'#ff8f4a9b');
  rect(b.x-3,b.y-6,6,14,C.yellow);rect(b.x-1,b.y-10,2,6,C.white);
 }
 for(const b of badBullets){
  rect(b.x-5,b.y-5,10,10,C.red);rect(b.x-2,b.y-2,4,4,C.yellow);
 }
}
function gateText(g){
 const prefix=g.label;
 return prefix+(g.val>0&&prefix.endsWith(' ')?'+':'')+g.val+(g.type==='speed'?'%':'');
}
function drawGate(g){
 const y=Math.round(g.y);
 if(y>FIELD_BOTTOM||y<-72)return;
 const options=[g.left,g.right];
 options.forEach((p,i)=>{
  const x=20+i*160;
  rect(x,y,158,52,p.good?'#2a8a5bbd':'#a14655c7');
  rect(x,y,158,7,p.good?'#b8ffd1':'#ffd1bb');
  rect(x,y+46,158,5,p.good?'#4af3a3':'#ff6679');
  rect(x,y,4,52,p.good?'#1e503d':'#5e2633');

}

function render(){
 ctx.save();
 if(mode==='menu'){drawMenu();ctx.restore();return}
 if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 background();
 for(const g of gates)drawGate(g);
 for(const e of enemies)drawEnemy(e);
 drawBoss();drawBullets();drawCat();drawEffects();
 ctx.restore();
 drawHud();
 if(mode==='clear')drawClear();
 if(mode==='dead')drawDead();
 if(mode==='paused')drawPaused();
}
function handleTap(x,y){
 if(mode==='menu'){
  if(y>=472&&y<=541){newRun();return}
  if(y>=545&&y<=602){window.location.href='./gomoku.html';return}
  return;
 }
 if(mode==='dead'){if(y>=408&&y<=482)newRun();return}
 if(mode==='clear'){
  if(y>=384&&y<=493){if(x>=40&&x<180)nextStage(0);else if(x>180&&x<321)nextStage(1)}
  return;
 }
 if(mode==='paused'){
  if(y>=308&&y<=382){mode='play';return}
  if(y>=386&&y<=449){newRun();return}
  return;
 }
 if(mode==='play'&&x>318&&y<54){mode='paused';say('遊戲暫停');return}
}
function eventPoint(event){
 const r=canvas.getBoundingClientRect();
 return {x:(event.clientX-r.left)/r.width*W,y:(event.clientY-r.top)/r.height*H};
}
canvas.addEventListener('pointerdown',e=>{
 e.preventDefault();canvas.focus({preventScroll:true});
 const p=eventPoint(e);
 if(mode==='play'&&!(p.x>318&&p.y<54)){
  input.down=true;input.x=clamp(p.x,37,323);
  try{canvas.setPointerCapture(e.pointerId)}catch(err){}
 }else handleTap(p.x,p.y);
});
canvas.addEventListener('pointermove',e=>{
 if(!input.down||mode!=='play')return;
 const p=eventPoint(e);input.x=clamp(p.x,37,323);
});
function release(){input.down=false}
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);
window.addEventListener('blur',()=>{release();input.left=false;input.right=false;if(mode==='play')mode='paused'});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')mode='paused'});
window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight',' ','Enter','Escape','a','d','A','D','p','P'].includes(e.key))e.preventDefault();
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')input.left=true;
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')input.right=true;
 if(e.repeat)return;
 if(mode==='menu'&&(e.key==='Enter'||e.key===' '))newRun();
 else if(mode==='dead'&&(e.key==='Enter'||e.key===' '))newRun();
 else if(mode==='clear'&&e.key==='1')nextStage(0);
 else if(mode==='clear'&&e.key==='2')nextStage(1);
 else if((e.key==='p'||e.key==='P'||e.key==='Escape')&&mode==='play')mode='paused';
 else if((e.key==='p'||e.key==='P'||e.key==='Escape')&&mode==='paused')mode='play';
 else if(mode==='paused'&&(e.key==='Enter'||e.key===' '))mode='play';
});
window.addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')input.left=false;
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')input.right=false;
});
function frame(t){
 if(!lastFrame)lastFrame=t;
 let dt=Math.min(.05,(t-lastFrame)/1000);lastFrame=t;
 update(dt);render();requestAnimationFrame(frame);
}
player={x:180,y:600,hp:8,maxHp:8,power:8,lanes:1,interval:.29,inv:0};
requestAnimationFrame(frame);
})();
</script>
