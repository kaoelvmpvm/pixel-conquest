<body>
<div id="app">
<header class="top"><div><div class="eyebrow">RETRO PUZZLE / BETA 01</div><h1>PIXEL LOCK <span style="color:var(--mint)">▣</span></h1><div class="sub">像素解謎 · 1 關教學 + 10 關正式關卡</div></div><div class="toolbox"><button class="btn sm" data-action="sound">♫ 音效：開</button><button class="btn sm warn" data-action="resetAll">清除進度</button></div></header>
<section class="shell"><main class="panel"><div class="panelhead"><b id="levelTitle">LEVEL 00</b><span class="chapter" id="levelTag">TUTORIAL</span></div><div class="intro" id="description"></div><div class="stage" id="stage" aria-live="polite"></div></main>
<aside class="panel"><div class="panelhead"><b>安全出口</b><span class="chapter" id="count">00 / 10</span></div><div class="sidebody"><div class="exit" id="exit"><span>▣</span><strong>LOCKED</strong></div><div class="smalltitle">4-DIGIT ACCESS CODE</div><div class="digits" id="digits"></div><div class="keypad" id="keypad"></div><div class="status" id="lockStatus">先操作機關，再輸入四位數密碼。</div><div class="divider"></div><div class="actions"><button class="btn sm" data-action="reset">↺ 重置本關</button><button class="btn sm gold" data-action="hint">◈ 取得提示</button></div><div class="hintbox" id="hintArea">每關設有三階段提示，不會直接公布完整答案。</div><div id="nextArea"></div></div></aside></section>
<nav class="nav" id="nav" aria-label="關卡選擇"></nav><footer class="foot">方向鍵／WASD 可控制移動關卡。所有機關均可使用點擊或觸控操作。進度自動儲存於目前裝置。<br>PIXEL LOCK BETA 01 · HTML5 單檔遊戲</footer>
</div>
<script>
(function(){
'use strict';
const LEVELS=[
{t:'密碼鎖入門',tag:'TUTORIAL',code:'3142',desc:'觀察四張數字牌，輸入密碼開門。這一關只教會你操作方式。',h:['看著牆上的四張牌。','依照從左到右排列。','在右側面板輸入四位數，按確認。']},
{t:'閃爍的密碼',tag:'SIGNAL ORDER',code:'1368',desc:'燈光亮起的先後次序，才是正確的排列方式。按下播放，觀察四盞燈。',h:['每盞燈下方都有固定數字。','記下燈亮起的順序，不是數字大小順序。','依序讀取第 2、4、1、3 盞燈上的數字。']},
{t:'斷電的控制室',tag:'PIPE NETWORK',code:'6294',desc:'點擊管線使其旋轉 90°。由左側電源送電到四個接收器，讀取 A、B、C、D。',h:['必須讓管線兩端開口相對，電才能流動。','從左邊的電源開始，一路沿著已接通的線往外檢查。','上方需要分岔兩路，下方也需要分岔兩路。']},
{t:'不能後退的箱子',tag:'SOKOBAN',code:'7045',desc:'用方向鍵或下方按鈕推動四個木箱，使它們全部停在發亮的壓力板上。箱子不能拉回。',h:['不要把箱子推到貼牆的死角。','先想好箱子到目的地需要從哪一側推。','可使用「復原一步」，不必每次都從頭開始。']},
{t:'光線會說話',tag:'LASER MIRROR',code:'2851',desc:'旋轉三面鏡子並發射雷射。讓光線分別擊中 A、B、C、D 四個接收器。',h:['光線會依照鏡面角度改變方向。','中央鏡決定雷射往上或往下。','上下兩面鏡子再決定光往左或往右。']},
{t:'重疊的真相',tag:'PIXEL OVERLAY',code:'3907',desc:'兩張像素膠片各有一半線索。旋轉、移動第二張膠片，使兩張圖完整重疊。',h:['青色與橘色像素應該能拼成完整數字。','先把膠片旋回正確方向，再調整位置。','重疊正確時，會出現四個清楚的數字。']},
{t:'連動齒輪',tag:'LINKED GEARS',code:'8246',desc:'點擊齒輪會使自己順時針旋轉 90°，同時使右邊齒輪逆時針旋轉 90°。讓四個箭頭全部朝上。',h:['每一個操作會影響兩個齒輪。','右邊第四個齒輪也會連動到第一個。','可以先修正第一個齒輪，再處理後續連動。']},
{t:'神祕電波',tag:'RADIO DECODE',code:'3526',desc:'調到清晰的頻道，播放四組訊號。短脈衝代表 1，長脈衝代表 2；每組加總得到一位數字。',h:['雜訊頻道無法提供穩定內容。','先把旋鈕調到訊號清晰的頻道。','每一排分別加總，短＝1，長＝2。']},
{t:'一按全變',tag:'LIGHTS OUT',code:'6935',desc:'點擊方格會反轉自己及上、下、左、右相鄰方格的亮滅。將 16 格全部點亮。',h:['按同一格兩次等於沒有按。','可以先觀察每次按鍵影響哪些格。','試著從上方的暗格開始，逐排往下處理。']},
{t:'兩個世界，一把鑰匙',tag:'DUAL WORLD',code:'4187',desc:'在正常世界推動箱子，切換到影子世界啟動四個感應板。兩個世界可走的範圍不同，但箱子位置不會重設。',h:['只有影子世界能啟動感應板。','某些站位只能在正常世界完成，另一些只能在影子世界完成。','箱子在最左邊時，用正常世界才能站到它的左側；在最右邊時則相反。']},
{t:'最後一道門',tag:'FINAL CHAMBER',code:'9062',desc:'先觀看閃燈順序，再依正確順序用鏡面雷射啟動四個接收器。最後組合像素膠片找出真正的密碼。',h:['燈光先決定接收器 A、B、C、D 的正確次序。','發射到錯誤接收器會重置啟動順序，但鏡子不會重置。','依序解鎖四個接收器後，才會開啟像素膠片機關。']}
];
const $=id=>document.getElementById(id);
const DIR=['N','E','S','W'],DELTA=[[0,-1],[1,0],[0,1],[-1,0]];
const PIPE={
'2,1':['N','E','W'],'1,1':['S','E'],'1,2':['W','E'],'1,3':['N','E','W'],'0,3':['S','E'],
'2,2':['W','S'],'3,2':['N','S','E'],'3,3':['W','E'],'4,2':['N','E'],'4,3':['W','E']
};
const TARGETS={'0,4':['A','6'],'1,4':['B','2'],'3,4':['C','9'],'4,4':['D','4']};
const MIRRORS={'2,2':true,'2,0':true,'2,4':true};
const RECEIVERS={'6,0':'A','6,4':'B','0,0':'C','0,4':'D'};
const LIGHT_TAPS=[0,1,5,6,8,11,13,14];
const BITMAP={'0':['111','101','101','101','111'],'1':['010','110','010','010','111'],'2':['111','001','111','100','111'],'3':['111','001','111','001','111'],'4':['101','101','111','001','001'],'5':['111','100','111','001','111'],'6':['111','100','111','101','111'],'7':['111','001','010','010','010'],'8':['111','101','111','101','111'],'9':['111','101','111','001','111']};
let store={unlocked:0,hints:{},sound:true};try{const s=JSON.parse(localStorage.getItem('pixel-lock-beta01')||'{}');if(s&&typeof s==='object'){store.unlocked=Math.max(0,Math.min(11,Number(s.unlocked)||0));store.hints=s.hints||{};store.sound=s.sound!==false;}}catch(e){}
let game={idx:Math.min(store.unlocked,10),input:'',done:false,data:{},notice:'',timers:[],playing:false};
function save(){try{localStorage.setItem('pixel-lock-beta01',JSON.stringify(store));}catch(e){}}
function later(f,ms){const t=setTimeout(f,ms);game.timers.push(t);}
function stopTimers(){game.timers.forEach(clearTimeout);game.timers=[];game.playing=false;}
function beep(freq=440,length=0.06){if(!store.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A(),o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+length);o.stop(a.currentTime+length);o.onended=()=>a.close();}catch(e){}}
function key(k,cls){return '<button class="key '+(cls||'')+'" data-action="key" data-value="'+k+'">'+(k==='X'?'⌫':k==='OK'?'確認':k)+'</button>';}
function makeKeypad(){const keys=['1','2','3','4','5','6','7','8','9','X','0','OK'];$('keypad').innerHTML=keys.map(k=>key(k,k==='X'?'del':k==='OK'?'enter':'')).join('');}
function updateLock(){const s=game.input; $('digits').innerHTML=[0,1,2,3].map(i=>'<div class="digit '+(i<s.length?'filled':'')+'">'+(s[i]||'–')+'</div>').join('');$('exit').classList.toggle('open',game.done);$('exit').innerHTML=game.done?'<span>◇</span><strong>OPEN</strong>':'<span>▣</span><strong>LOCKED</strong>'; if(game.done){$('lockStatus').textContent='解鎖成功！出口已開啟。';}else{$('lockStatus').textContent=game.notice||'先完成機關，再輸入四位數密碼。';}}
function init(n){if(n===1)return{played:false,speed:1};
if(n===2){let rot={};Object.keys(PIPE).forEach((k,i)=>rot[k]=[1,2,3,1,2,3,2,1,3,1][i]);return{rot};}
if(n===3)return{p:[5,6],boxes:[[3,4],[5,4],[2,5],[4,5]],goals:[[2,2],[4,2],[6,2],[4,3]],history:[]};
if(n===4)return{mirrors:{'2,2':'/','2,0':'/','2,4':'/'},lit:{},path:[]};
if(n===5)return{dx:2,dy:-1,rot:2};
if(n===6){const g=[0,0,0,0];[0,1,0,3,2].forEach(i=>{g[i]=(g[i]+1)%4;g[(i+1)%4]=(g[(i+1)%4]+3)%4;});return{g};}
if(n===7)return{channel:1,heard:false};
if(n===8){let cells=Array(16).fill(true);LIGHT_TAPS.forEach(i=>flip(cells,i));return{cells};}
if(n===9)return{world:'normal',p:[3,5],box:[3,3],lit:{},history:[]};
if(n===10)return{phase:0,mirrors:{'2,2':'/','2,0':'/','2,4':'/'},lit:{},path:[],seq:0,dx:2,dy:-1,rot:2};
return{};}
function load(n){if(n<0||n>10||n>store.unlocked)return;stopTimers();game.idx=n;game.data=init(n);game.done=false;game.input='';game.notice='';render();}
function render(){const l=LEVELS[game.idx];$('levelTitle').textContent='LEVEL '+String(game.idx).padStart(2,'0')+' / '+l.t;$('levelTag').textContent=l.tag;$('description').textContent=l.desc;$('count').textContent=String(game.idx).padStart(2,'0')+' / 10';document.querySelector('[data-action="sound"]').textContent=store.sound?'♫ 音效：開':'♫ 音效：關';$('nav').innerHTML=LEVELS.map((v,i)=>'<button data-action="level" data-value="'+i+'" '+(i>store.unlocked?'disabled':'')+' class="'+(game.idx===i?'active':i<store.unlocked?'passed':'')+'" title="'+v.t+'">'+(i===0?'教':String(i).padStart(2,'0'))+'</button>').join('');updateLock();renderHint();renderNext();renderStage();}
function renderHint(){const count=store.hints[game.idx]||0;$('hintArea').textContent=count?LEVELS[game.idx].hints[count-1]:'需要協助時，可逐步開啟三階段提示。';document.querySelector('[data-action="hint"]').textContent=count>=3?'◈ 已達第 3 提示':'◈ 提示 '+(count+1)+'/3';}
function renderNext(){const area=$('nextArea');if(!game.done){area.innerHTML='';return;}area.innerHTML='<div class="divider"></div><div class="actions"><button class="btn accent" data-action="'+(game.idx===10?'credits':'next')+'">'+(game.idx===10?'★ 查看結局':'下一關 →')+'</button></div>';}
function note(s){$('stage').querySelector('.msg')?.remove();const div=document.createElement('div');div.className='msg';div.textContent=s;$('stage').appendChild(div);}
function b(act,label,value,cl){return'<button class="btn '+(cl||'')+'" data-action="'+act+'"'+(value===undefined?'':' data-value="'+value+'"')+'>'+label+'</button>';}
function wrapper(inner,msg){$('stage').innerHTML=inner+'<div class="msg">'+(msg||'')+'</div>';}
function ready(){const d=game.data,n=game.idx;if(n===0)return true;if(n===1)return !!d.played;if(n===2)return pipePower().count===4;if(n===3)return d.goals.every(g=>d.boxes.some(x=>same(g,x)));if(n===4)return Object.keys(d.lit).length===4;if(n===5)return aligned();if(n===6)return d.g.every(x=>x===0);if(n===7)return d.channel===2&&d.heard;if(n===8)return d.cells.every(Boolean);if(n===9)return Object.keys(d.lit).length===4;if(n===10)return d.phase===1&&aligned();return false;}
function aligned(){const d=game.data;return d.dx===0&&d.dy===0&&d.rot===0;}
function same(a,b){return a[0]===b[0]&&a[1]===b[1];}
function check(){if(game.input.length!==4){game.notice='請先輸入四位數。';beep(160);updateLock();return;}if(game.input!==LEVELS[game.idx].code){game.notice='密碼錯誤，可以重新檢查線索。';beep(145);game.input='';updateLock();return;}if(!ready()){game.notice='數字正確，但機關尚未完成；請先實際解開本關機關。';beep(180);updateLock();return;}game.done=true;store.unlocked=Math.max(store.unlocked,Math.min(11,game.idx+1));save();beep(784,.18);game.notice='';render();if(game.idx===10)note('全部十關正式機關已破解！按右側按鈕觀看結局。');}
function flip(cells,i){let x=i%4,y=Math.floor(i/4);[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(p=>{let xx=x+p[0],yy=y+p[1];if(xx>=0&&xx<4&&yy>=0&&yy<4)cells[yy*4+xx]=!cells[yy*4+xx];});}
function pipeDirs(k){const rot=game.data.rot[k]||0;return PIPE[k].map(t=>DIR[(DIR.indexOf(t)+rot)%4]);}
function pipePower(){const visited=new Set(['2,0']);let q=[[2,0]],dirsAt=(r,c)=>{const k=r+','+c;if(k==='2,0')return['E'];if(PIPE[k])return pipeDirs(k);if(TARGETS[k])return['W'];return[];};
while(q.length){const [r,c]=q.shift();const here=dirsAt(r,c);here.forEach(d=>{const i=DIR.indexOf(d),nr=r+DELTA[i][1],nc=c+DELTA[i][0],k=nr+','+nc;if(nr<0||nc<0||nr>=5||nc>=5||visited.has(k))return;if(dirsAt(nr,nc).includes(DIR[(i+2)%4])){visited.add(k);q.push([nr,nc]);}});}
let count=Object.keys(TARGETS).filter(k=>visited.has(k)).length;return{visited,count};}
function wire(dirs){return'<div class="wirebox"><i class="wire core"></i>'+dirs.map(dir=>'<i class="wire '+dir.toLowerCase()+'"></i>').join('')+'</div>';}
function boardPipe(){const p=pipePower();let arr=[];for(let r=0;r<5;r++){for(let c=0;c<5;c++){let k=r+','+c,cl='cell',inner='';if(k==='2,0'){cl+=' source';inner=wire(['E'])+'<small class="boardlabel">電</small>';}else if(PIPE[k]){cl+=(p.visited.has(k)?' power':'');inner=wire(pipeDirs(k));}else if(TARGETS[k]){cl+=' target'+(p.visited.has(k)?' on':'');inner=TARGETS[k][0]+'<small style="font-size:16px">'+(p.visited.has(k)?TARGETS[k][1]:'?')+'</small>';}else{cl+=' wall';}arr.push('<button class="'+cl+'" style="width:100%;height:100%" '+(PIPE[k]?'data-action="pipe" data-value="'+k+'"':'disabled')+' aria-label="管線 '+k+'">'+inner+'</button>');}}
return'<div class="grid" style="grid-template-columns:repeat(5,minmax(42px,60px))">'+arr.join('')+'</div><div class="status">已接通 '+p.count+' / 4 個接收器　｜　'+(p.count===4?'A → B → C → D':'旋轉管線，讓電流流通')+'</div>';}
function controls(){return'<div class="mobilepad">'+b('move','↑','U','')+b('move','↑','U','')+b('move','↑','U','')+'</div>';}
function dpad(){return'<div class="mobilepad"><span class="blank"></span>'+b('move','▲','U')+'<span class="blank"></span>'+b('move','◀','L')+b('undo','↶')+b('move','▶','R')+'<span class="blank"></span>'+b('move','▼','D')+'<span class="blank"></span></div>';}
function boardSokoban(){const d=game.data,out=[];for(let y=0;y<9;y++)for(let x=0;x<9;x++){const wall=x===0||x===8||y===0||y===8;const box=d.boxes.some(p=>same(p,[x,y])),goal=d.goals.some(p=>same(p,[x,y])),player=same(d.p,[x,y]);const cl=wall?'wall':box?'box':player?'player':goal?'goal':'floor';out.push('<div class="cell '+cl+'" title="'+(wall?'牆壁':box?'箱子':player?'機器人':goal?'壓力板':'地板')+'">'+(box?'▣':player?'◆':goal?'◎':'')+'</div>');}
const complete=ready();return'<div class="grid" style="grid-template-columns:repeat(9,minmax(25px,42px))">'+out.join('')+'</div>'+dpad()+'<div class="status">'+(complete?'四個壓力板已啟動！顯示器：7 0 4 5':'◆ 為玩家，▣ 為箱子，◎ 為壓力板（可復原操作）')+'</div>';}
function moveSok(dv){const dirs={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]},v=dirs[dv];if(!v)return;const d=game.data,p=[d.p[0]+v[0],d.p[1]+v[1]],wall=t=>t[0]<=0||t[0]>=8||t[1]<=0||t[1]>=8;if(wall(p))return;const i=d.boxes.findIndex(a=>same(a,p));let next=null;if(i>=0){next=[p[0]+v[0],p[1]+v[1]];if(wall(next)||d.boxes.some(z=>same(z,next)))return;}d.history.push({p:[...d.p],boxes:d.boxes.map(x=>[...x])});d.p=p;if(i>=0)d.boxes[i]=next;beep(260,.025);renderStage();}
function raycast(){let x=0,y=2,d='E',path=[[x,y]],seen=new Set(),hit=null;const mirrors=game.data.mirrors;for(let i=0;i<50;i++){const j=DIR.indexOf(d);x+=DELTA[j][0];y+=DELTA[j][1];if(x<0||x>=7||y<0||y>=5)break;const sig=x+','+y+','+d;if(seen.has(sig))break;seen.add(sig);path.push([x,y]);const k=x+','+y;if(RECEIVERS[k]){hit=RECEIVERS[k];break;}if(mirrors[k]){const slash=mirrors[k]==='/';d=(slash?{N:'E',E:'N',S:'W',W:'S'}:{N:'W',W:'N',S:'E',E:'S'})[d];}}
return{path,hit};}
function boardLaser(final){const d=game.data,path=new Set(d.path.map(p=>p.join(',')));let out=[];for(let y=0;y<5;y++)for(let x=0;x<7;x++){const k=x+','+y,m=d.mirrors[k],receiver=RECEIVERS[k],source=x===0&&y===2;let cl='cell '+(m?'mirror':receiver?'receiver target':source?'source':path.has(k)?'laserpath':'floor');if(receiver&&d.lit[receiver])cl+=' on';out.push('<button class="'+cl+'" '+(m?'data-action="mirror" data-value="'+k+'"':'disabled')+' title="'+(m?'旋轉反射鏡':receiver?'接收器 '+receiver:'')+'">'+(m?m:receiver?receiver:source?'➤':path.has(k)?'·':'')+'</button>');}
return'<div class="grid" style="grid-template-columns:repeat(7,minmax(34px,52px))">'+out.join('')+'</div><div class="actions">'+b('fire','➤ 發射雷射',undefined,'gold')+b('clearBeam','清除光路')+'</div><div class="status">'+(final?'啟動進度 '+d.seq+' / 4，錯誤順序會重新計算': '已啟動 '+Object.keys(d.lit).length+' / 4 個接收器')+'</div>'+(final?'':'<div class="tag">A '+(d.lit.A?'2':'?')+'　B '+(d.lit.B?'8':'?')+'　C '+(d.lit.C?'5':'?')+'　D '+(d.lit.D?'1':'?')+'</div>');}
function fire(final){const result=raycast(),d=game.data;d.path=result.path;beep(660,.09);if(result.hit){if(final){const target=['D','B','A','C'][d.seq];if(result.hit===target){d.seq++;d.lit[result.hit]=true;if(d.seq===4){d.phase=1;d.dx=2;d.dy=-1;d.rot=2;}}else{d.seq=0;d.lit={};game.notice='接收器順序錯誤，已重置啟動進度。';updateLock();}}else{d.lit[result.hit]=true;}}renderStage();}
function overlayUI(){return'<div class="tag">青色 + 橘色 = 完整圖案　｜　先旋轉，再平移</div><canvas class="overlay" id="overlayCanvas" width="440" height="180" aria-label="兩層可移動的數字像素膠片"></canvas><div class="actions">'+b('overlay','↶ 旋轉', 'rot')+b('overlay','←','left')+b('overlay','→','right')+b('overlay','↑','up')+b('overlay','↓','down')+'</div><div class="status">'+(aligned()?'◈ 圖層已完全吻合，現在可以辨識密碼。':'調整兩層像素，讓碎片對齊並重組數字。')+'</div>';}
function overlayPaint(){const canvas=$('overlayCanvas');if(!canvas)return;const ctx=canvas.getContext('2d');if(!ctx)return;const w=440,h=180;ctx.fillStyle='#0b1727';ctx.fillRect(0,0,w,h);const code=game.idx===10?'9062':'3907',a=[],b=[];for(let i=0;i<4;i++){BITMAP[code[i]].forEach((row,y)=>{for(let x=0;x<3;x++)if(row[x]==='1'){const p=[i*5+x,y];((x+y+i)%2===0?a:b).push(p);}});}
const d=game.data,scale=17,centerX=220,centerY=90,ox=-8.5,oy=-2;function pts(points,color,dx,dy,rot){ctx.fillStyle=color;points.forEach(p=>{let x=p[0]-8.5,y=p[1]-2;for(let j=0;j<rot;j++){const a=x;x=-y;y=a;}ctx.fillRect(centerX+(x+dx)*scale,centerY+(y+dy)*scale,scale-2,scale-2);});}
ctx.strokeStyle='#39516a';ctx.strokeRect(26,38,388,108);pts(a,'#5ce3df',0,0,0);pts(b,'#ffa356',d.dx,d.dy,d.rot);if(aligned()){ctx.strokeStyle='#9df4af';ctx.lineWidth=3;ctx.strokeRect(21,32,399,117);}}
function adjustOverlay(v){const d=game.data;if(v==='rot')d.rot=(d.rot+1)%4;if(v==='left')d.dx=Math.max(-3,d.dx-1);if(v==='right')d.dx=Math.min(3,d.dx+1);if(v==='up')d.dy=Math.max(-3,d.dy-1);if(v==='down')d.dy=Math.min(3,d.dy+1);beep(340,.035);renderStage();}
function boardGears(){const d=game.data;return'<div class="gears">'+d.g.map((n,i)=>'<button class="gear" data-action="gear" data-value="'+i+'" aria-label="旋轉齒輪 '+(i+1)+'"><span style="transform:rotate('+(n*90)+'deg)">↑</span></button>').join('')+'</div><div class="status">'+(ready()?'所有箭頭歸零！面板顯示：8 2 4 6':'點擊齒輪：自身順時針 +1，右側相鄰齒輪逆時針 −1')+'</div>';}
function boardRadio(){const d=game.data;let waves=d.channel===2?[[1,1,1],[2,2,1],[1,1],[2,2,2]]:[[1,2,1,2,1,1],[2,1,2,1],[1,2,2,1,1],[2,1,1,2]];return'<div class="tag">調諧器：CH '+d.channel+' / 3　'+(d.channel===2?'● SIGNAL CLEAR':'◌ STATIC NOISE')+'</div><div class="actions">'+b('channel','◀ 降低頻道',-1)+b('channel','提高頻道 ▶',1)+b('radio','▶ 播放訊號',undefined,'gold')+'</div>'+waves.map((group,i)=>'<div class="wavegroup"><span class="number">'+(i+1)+'.</span><div class="wave">'+group.map(v=>'<i class="pulse '+(v===1?'short':'long')+'" style="'+(d.channel===2?'':'opacity:.3')+'"></i>').join('')+'</div></div>').join('')+'<div class="status">短脈衝 = 1　·　長脈衝 = 2<br>'+(d.channel===2?(d.heard?'訊號已記錄，請將每一組加總。':'頻道清晰，按播放確認訊號。'):'雜訊太強！請尋找可以穩定接收的頻道。')+'</div>';}
function boardLights(){const d=game.data;return'<div class="grid" style="grid-template-columns:repeat(4,minmax(49px,72px))">'+d.cells.map((v,i)=>'<button class="cell '+(v?'light-on':'light-off')+'" data-action="light" data-value="'+i+'">'+(v?'✦':'·')+'</button>').join('')+'</div><div class="status">亮燈 '+d.cells.filter(Boolean).length+' / 16　'+(ready()?'全數點亮，顯示器：6 9 3 5':'點亮所有格子，不限制操作次數')+'</div>';}
function canWalk(world,x,y){return y>=1&&y<=5&&(world==='normal'?x>=1&&x<=4:x>=2&&x<=5);}
function boardWorld(){const d=game.data,pads=[[2,2],[4,2],[2,4],[4,4]],out=[];for(let y=0;y<7;y++)for(let x=0;x<7;x++){const ok=canWalk(d.world,x,y),onpad=pads.some(p=>same(p,[x,y]));const box=same(d.box,[x,y]),player=same(d.p,[x,y]);let cl=!ok?'wall':box?'box':player?'player':onpad?'goal':'floor';let symbol=box?'▣':player?'◆':onpad?(d.lit[x+','+y]?'✦':'◎'):'';out.push('<div class="cell '+cl+'">'+symbol+'</div>');}
return'<div class="tag world '+d.world+'">WORLD : '+(d.world==='normal'?'NORMAL / 正常世界':'SHADOW / 影子世界')+'</div><div class="grid" style="grid-template-columns:repeat(7,minmax(32px,48px))">'+out.join('')+'</div><div class="actions">'+b('world','◉ 切換世界',undefined,'gold')+'</div>'+dpad()+'<div class="status">影子世界感應板 '+Object.keys(d.lit).length+' / 4　'+(ready()?'已解鎖：4 1 8 7':'箱子位置會保留；切換不能讓角色或箱子卡進牆內')+'</div>';}
function moveWorld(v){const dirs={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]},delta=dirs[v];if(!delta)return;const d=game.data,p=[d.p[0]+delta[0],d.p[1]+delta[1]];if(!canWalk(d.world,p[0],p[1]))return;let box=null;if(same(p,d.box)){box=[p[0]+delta[0],p[1]+delta[1]];if(!canWalk(d.world,box[0],box[1]))return;}d.history.push({p:[...d.p],box:[...d.box],world:d.world,lit:{...d.lit}});d.p=p;if(box)d.box=box;if(d.world==='shadow'&&[[2,2],[4,2],[2,4],[4,4]].some(a=>same(a,d.box)))d.lit[d.box.join(',')]=true;beep(260,.025);renderStage();}
function boardFinal(){const d=game.data;if(d.phase===1)return'<div class="victory">FINAL LOCK / 解密膠片</div>'+overlayUI();return'<div class="tag">觀察四個啟動訊號的順序</div><div class="actions">'+b('blink','▶ 重播訊號',undefined,'gold')+'</div><div class="actions" id="lamps">'+['A','B','C','D'].map(n=>'<button class="btn" style="min-width:57px;min-height:58px" id="lamp'+n+'">'+n+'</button>').join('')+'</div>'+boardLaser(true);}
function renderStage(){const d=game.data;let body='',msg='';switch(game.idx){
case 0:body='<div class="tag">找到門鎖上的四位數密碼</div><div class="actions">'+['3','1','4','2'].map(n=>'<div class="plaque">'+n+'</div>').join('')+'</div><div class="status">讀取順序：由左至右 → 在右側密碼面板輸入</div>';break;
case 1:body='<div class="actions" id="lamps">'+[6,1,8,3].map((n,i)=>'<button class="plaque" style="width:64px;height:75px;font-size:31px" id="lamp'+i+'" disabled>'+n+'</button>').join('')+'</div><div class="actions">'+b('blink','▶ 播放燈號',undefined,'gold')+b('speed','播放速度：'+(d.speed===1?'標準':'慢速'))+'</div><div class="status">'+(d.played?'序列已播放，請依亮起次序整理數字。':'按播放，觀察亮燈順序。')+'</div>';break;
case 2:body=boardPipe();break;
case 3:body=boardSokoban();break;
case 4:body=boardLaser(false);break;
case 5:body=overlayUI();break;
case 6:body=boardGears();break;
case 7:body=boardRadio();break;
case 8:body=boardLights();break;
case 9:body=boardWorld();break;
case 10:body=boardFinal();break;
}
msg=ready()?'◈ 機關完成！請將推理得到的四位數輸入門鎖。':'操作場景中的物件，破解本關規則。';wrapper(body,msg);if((game.idx===5)||(game.idx===10&&d.phase===1))overlayPaint();}
function blink(){if(game.playing)return;game.playing=true;const n=game.idx,sequence=n===1?[1,3,0,2]:['D','B','A','C'];const slow=n===1&&game.data.speed===2,step=slow?800:520;sequence.forEach((id,i)=>later(()=>{const e=$('lamp'+id);if(e){e.classList.add('spark');beep(350+i*95,.08);}later(()=>e&&e.classList.remove('spark'),step*.5);},i*step));later(()=>{game.playing=false;if(n===1){game.data.played=true;renderStage();}else if(n===10)note('訊號播放完畢。現在依順序啟動接收器。');},sequence.length*step+150);}
function levelKey(k){if(game.done)return;if(k==='X'){game.input=game.input.slice(0,-1);game.notice='';beep(300,.025);}else if(k==='OK'){check();return;}else if(/^[0-9]$/.test(k)&&game.input.length<4){game.input+=k;game.notice='';beep(520,.025);}updateLock();}
function endScreen(){stopTimers();$('stage').innerHTML='<div class="completed"><div style="font-size:70px;color:var(--gold)">✦</div><h2>ALL LOCKS CLEARED</h2><div>你已破解 10 個不同的機關，成功逃離像素密室。</div><div class="progress">PIXEL LOCK · BETA 01 COMPLETE</div>'+b('level','返回教學關','0','gold')+'</div>';$('nextArea').innerHTML='';}
function action(act,val){const d=game.data,n=game.idx;if(act==='level'){load(+val);return;}if(act==='next'){load(Math.min(n+1,10));return;}if(act==='credits'){endScreen();return;}if(act==='sound'){store.sound=!store.sound;save();render();return;}if(act==='resetAll'){if(confirm('確定清除全部關卡進度及提示紀錄？此操作無法還原。')){store.unlocked=0;store.hints={};save();load(0);}return;}if(act==='reset'){load(n);return;}if(act==='hint'){store.hints[n]=Math.min(3,(store.hints[n]||0)+1);save();renderHint();beep(650);return;}if(act==='key'){levelKey(val);return;}if(game.done)return;
if(act==='blink'&&(n===1||n===10&&d.phase===0)){blink();return;}
if(act==='speed'&&n===1){d.speed=d.speed===1?2:1;renderStage();return;}
if(act==='pipe'&&n===2&&PIPE[val]){d.rot[val]=(d.rot[val]+1)%4;beep(390,.03);renderStage();return;}
if(act==='move'){if(n===3)moveSok(val);if(n===9)moveWorld(val);return;}
if(act==='undo'&&(n===3||n===9)){const old=d.history.pop();if(old){d.p=old.p;if(n===3)d.boxes=old.boxes;else{d.box=old.box;d.world=old.world;d.lit=old.lit;}renderStage();}return;}
if(act==='mirror'&&(n===4||n===10&&d.phase===0)&&d.mirrors[val]){d.mirrors[val]=d.mirrors[val]==='/'?'\\':'/';d.path=[];beep(350,.03);renderStage();return;}
if(act==='fire'&&(n===4||n===10&&d.phase===0)){fire(n===10);return;}
if(act==='clearBeam'&&(n===4||n===10)){d.path=[];renderStage();return;}
if(act==='overlay'&&(n===5||n===10&&d.phase===1)){adjustOverlay(val);return;}
if(act==='gear'&&n===6){const i=+val;d.g[i]=(d.g[i]+1)%4;d.g[(i+1)%4]=(d.g[(i+1)%4]+3)%4;beep(420,.04);renderStage();return;}
if(act==='channel'&&n===7){d.channel=Math.max(1,Math.min(3,d.channel+(+val)));d.heard=false;beep(400,.03);renderStage();return;}
if(act==='radio'&&n===7){d.heard=d.channel===2;beep(d.heard?650:180,.13);renderStage();return;}
if(act==='light'&&n===8){flip(d.cells,+val);beep(d.cells[+val]?660:330,.04);renderStage();return;}
if(act==='world'&&n===9){const w=d.world==='normal'?'shadow':'normal';if(!canWalk(w,...d.p)||!canWalk(w,...d.box)){note('無法切換！你或箱子會落入另一個世界的牆中。');beep(170);return;}d.history.push({p:[...d.p],box:[...d.box],world:d.world,lit:{...d.lit}});d.world=w;if(w==='shadow'&&[[2,2],[4,2],[2,4],[4,4]].some(a=>same(a,d.box)))d.lit[d.box.join(',')]=true;beep(750);renderStage();return;}
}
document.addEventListener('click',e=>{const x=e.target.closest('[data-action]');if(x&&!x.disabled)action(x.dataset.action,x.dataset.value);});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea'))return;const a={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R',W:'U',S:'D',A:'L',D:'R'};if(a[e.key]&&(game.idx===3||game.idx===9)&&!game.done){e.preventDefault();action('move',a[e.key]);}else if(/^\d$/.test(e.key)){action('key',e.key);}else if(e.key==='Backspace'){e.preventDefault();action('key','X');}else if(e.key==='Enter'){action('key','OK');}});
makeKeypad();load(game.idx);
})();
</script>
